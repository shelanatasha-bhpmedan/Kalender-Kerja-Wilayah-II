<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumen Penyumpahan BHP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="if(matchMedia('(min-width:901px)').matches)this.media='all'">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c1f2e;--mut:#6b7087;--line:#e3e5ef;--pri:#4f46e5;--pri2:#eef0ff;--ok:#0f9d6b;--warn:#c2410c;--rad:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;display:flex;gap:8px;align-items:center}
header h1 span{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.item{padding:10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.item.on{border-color:var(--pri);background:var(--pri2)}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.pchip{padding:3px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:#fff;cursor:pointer}.pchip.on{background:#1c2340;color:#fff;border-color:transparent}.pchip.on small{color:#fff}.pgrp{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 2px 2px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}.item b{display:block;font-size:13px}.item small{color:var(--mut)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border-radius:99px;font-size:13px}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h3{margin:4px 0 12px;font-size:15px}
.hint{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:#fff}
.child{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.doc b{font-size:13px}.doc div{display:flex;gap:6px}
.doc button{flex:1;padding:6px;font-size:12px}
#prev{background:#8a8fa3;padding:20px;border-radius:var(--rad);overflow:auto;max-height:80vh}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 20px;padding:1cm 2cm 2.5cm 3cm;font:12pt/1.5 Arial,"Liberation Sans",Helvetica,sans-serif;box-shadow:0 4px 20px #0003}
.paper p{margin:0;text-align:justify;text-indent:36pt}.paper p[data-line]{border-bottom:1px dotted #000;min-height:24pt;line-height:24pt;margin-right:0}
.paper p.ni,.paper p.ctr{text-indent:0}.paper p.ctr,.paper .ctr{text-align:center}
table.kop{width:100%;border-collapse:collapse;border-bottom:1.25pt solid #000;margin:0 0 12pt}
.paper table.hd td:first-child{padding-left:0}.paper table.hd td:last-child{padding-right:0}
table.kop td{padding:0 0 3pt;vertical-align:middle}
table.kop td.lg{width:62pt;padding:0}
table.kop td.lg img{width:58pt;height:65pt;display:block}
table.kop td.tx{text-align:center;line-height:1.15;font-size:12pt}
table.kop .b{font-weight:bold}table.kop .s{font-size:10pt}
.paper table{border-collapse:collapse}.paper td{vertical-align:top;padding:1pt 4pt}
.ctr{text-align:center}.ttd{width:100%;margin-top:20pt}.ttd td{width:50%;text-align:left}.ttd.ctr td{text-align:center}.paper ul.dash{list-style:none;padding-left:18pt}.paper ul.dash li::before{content:'-';display:inline-block;width:18pt;margin-left:-18pt}
.paper ol{margin:0 0 8pt;padding-left:18pt}.paper ol li{padding-left:0}.paper p[data-n]{padding-left:18pt;text-indent:-18pt}.paper p[data-n]::before{content:attr(data-n);display:inline-block;width:18pt;text-indent:0}.paper p[data-b]::before{font-weight:bold}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media print{@page{size:A4;margin:0}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}.paper{box-shadow:none;margin:0;page-break-after:always}}
body.locked header,body.locked .wrap{display:none}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:0 16px}
.log{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.logi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ld{margin-top:4px;font-size:13px}.dif{margin:0;padding-left:18px}
del{color:#b91c1c;text-decoration:line-through}ins{color:#047857;text-decoration:none;font-weight:600}
.meta{font-size:12px;color:var(--mut)}
.nomor{font-size:12px;padding:6px 8px;border-radius:8px;background:var(--pri2)}
.kurang{font-size:11px;color:var(--warn)}
/* ===== tema e-Office BHP Medan ===== */
:root{--navy:#1b2345;--navy2:#252f5c;--gold:#f6c343;--gold2:#fff6db;--pri:#1b2345;--pri2:#eef1f9;--bg:#f3f4f8;--line:#e4e7ef;--rad:16px}
body{padding-left:250px}
.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#cfd5ea;display:flex;flex-direction:column;z-index:10;overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid #ffffff14}
.side .brand img{width:38px;height:42px;object-fit:contain}.side .brand b{display:block;color:#fff;font-size:16px;letter-spacing:.3px}.side .brand small{font-size:11.5px;opacity:.75}
.side .sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;opacity:.55;padding:18px 20px 6px}
.side .nav{display:flex;gap:10px;align-items:center;margin:2px 12px;padding:11px 14px;border-radius:12px;color:#e8ebf7;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.side .nav:hover{background:#ffffff12}.side .nav.on{background:var(--gold);color:var(--navy);box-shadow:0 6px 18px #f6c34355}
.side .foot{margin-top:auto;padding:16px 20px;font-size:11px;opacity:.6;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}
.side .foot button{background:none;border:0;color:inherit;padding:0;font-size:14px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;gap:14px;align-items:center}
.top h2{margin:0;font-size:20px}.top small{color:var(--mut)}.top .grow{margin-right:auto}
.top #q{width:220px;border-radius:99px;padding:9px 16px}
#who{display:flex;gap:10px;align-items:center}
.uname{text-align:right;line-height:1.2}.uname b{display:block;font-size:13px;text-transform:uppercase}.uname small{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}
.menubtn{background:var(--navy)!important;color:#fff!important;border:0!important;border-radius:99px!important;padding:9px 16px!important}
.pri,button.pri,label.pri{background:var(--gold)!important;color:var(--navy)!important;border-color:var(--gold)!important;font-weight:700}
.pri:hover{filter:brightness(.97);box-shadow:0 6px 16px #f6c34366}
.steps button.on{background:var(--navy);border-color:var(--navy)}
.seg button.on{background:var(--navy)}
.item.on{border-color:var(--navy);background:var(--pri2)}
.tag{background:var(--gold2);color:#8a6200}
.wrap{padding:22px 26px;max-width:1500px;margin:0}
.card{border-radius:var(--rad);box-shadow:0 1px 3px #1b234510}
/* wizard */
.wz{max-width:880px;margin:0 auto;padding:30px 34px}
.wz-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.wz-h h2{margin:0 0 4px;font-size:22px}.wz-h p{margin:0;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--pri2);color:var(--mut);font-size:14px}
.stepper i.on{background:var(--navy);color:#fff}.stepper i.done{background:var(--gold);color:var(--navy)}
.stepper s{width:22px;height:2px;background:var(--line);text-decoration:none}
.wz h4{font-size:15px;margin:0 0 14px;display:flex;gap:8px;align-items:center}
.wz .lbl{font-weight:700;font-size:13px;margin:18px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;position:relative;transition:.15s}
.opt:hover{border-color:#c5cbe0}.opt.on{border-color:var(--navy);background:var(--pri2)}
.opt b{display:block;margin-bottom:4px}.opt span{font-size:12.5px;color:var(--mut)}
.opt:after{content:"";position:absolute;right:16px;top:16px;width:16px;height:16px;border-radius:50%;border:2px solid #b8bfd4}
.opt.on:after{border:5px solid var(--navy)}
.drop{margin-top:6px;border:2px dashed #c5cbe0;border-radius:16px;padding:38px 20px;text-align:center;cursor:pointer;background:var(--bg);transition:.15s;display:block}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--pri2)}
.drop .ic{font-size:40px}.drop b{display:block;font-size:16px;margin:8px 0 4px}.drop small{color:var(--mut)}
.wz-f{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.wz-f .pri{padding:11px 20px;border-radius:12px}
.link{background:none!important;border:0!important;color:var(--mut)!important;text-decoration:underline;padding:0!important}
.spin{width:38px;height:38px;border:4px solid var(--pri2);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.dash .card b{font-size:26px;display:block}.dash .card span{color:var(--mut);font-size:12.5px}
#login{background:radial-gradient(circle at 20% 10%,#2c3972,var(--navy) 70%)}
#login form{border:0;box-shadow:0 30px 60px #0005}
@media(max-width:900px){body{padding-left:0}.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .sec,.side .foot{display:none}.side .brand{border:0;padding:12px}.side .nav{margin:4px;padding:8px 10px;font-size:13px}.top{flex-wrap:wrap;padding:12px 16px}.top #q{width:100%}.wrap{padding:14px}.opts,.dash{grid-template-columns:1fr}.wz{padding:20px}}
[hidden]{display:none!important}
/* pengecekan */
.bad input,.bad select,.bad textarea{border-color:#e5484d!important;background:#fff5f5!important}
.bad label:after{content:" ⚠";color:#e5484d}
.warnf input,.warnf select,.warnf textarea{border-color:#f5a524!important;background:#fffaf0!important}
.warnf label:after{content:" ⚠";color:#d98a00}
.fmsg{display:block;font-size:11.5px;margin-top:3px;color:#c2272d}.warnf .fmsg{color:#a86a00}
.steps button{position:relative}.steps .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;font-size:10.5px;line-height:18px;padding:0 5px;color:#fff;background:#e5484d;font-weight:700}
.steps .dot.w{background:#f5a524}
.cekbar{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;cursor:pointer}
.cekbar.e{background:#fdecec;color:#9b1c1f;border:1px solid #f3b4b4}.cekbar.w{background:#fff6e0;color:#7a5200;border:1px solid #f2d38a}.cekbar.ok{background:#e9f8f1;color:#0b6b48;border:1px solid #b5e5cf;cursor:default}
.ceklist{margin:0;padding:0;list-style:none}.ceklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ceklist .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;color:#fff}.ceklist .ic.e{background:#e5484d}.ceklist .ic.w{background:#f5a524}
.ceklist a{margin-left:auto;font-size:12px;color:var(--navy);cursor:pointer;white-space:nowrap;text-decoration:underline}
/* paket berkas */
.paket{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:linear-gradient(180deg,var(--pri2),var(--card) 60%)}
.paket-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.paket-h>div:first-child{margin-right:auto}
.prog{width:140px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.paket-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.paket-c h5{margin:0 0 8px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.pk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:400}
.pk:hover{border-color:var(--navy)}.pk input{width:auto;margin-top:3px}.pk b{display:block;font-size:13.5px}.pk small{color:var(--mut);font-size:11.5px}
.pk.ok{border-color:#b5e5cf;background:#f1fbf6}
@media(max-width:900px){.paket-g{grid-template-columns:1fr}}
/* kalender */
.cal{user-select:none}.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cal-h b{font-size:17px;margin-right:auto}
.cal-h button{border-radius:10px;padding:7px 12px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-g .hd{font-size:11px;font-weight:700;color:var(--mut);text-align:center;letter-spacing:.5px;padding:4px 0}
.cal-g .d{border:1px solid var(--line);border-radius:12px;min-height:78px;padding:8px;cursor:pointer;position:relative;background:var(--card);transition:.12s}
.cal-g .d:hover{border-color:var(--navy);box-shadow:0 4px 14px #1b234514}
.cal-g .d.x{opacity:.35}.cal-g .d.we{background:var(--bg)}.cal-g .d.td{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-g .d.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal-g .n{font-weight:700;font-size:13px}
.cal-g .d.lb .n{color:#dc2626}.cal-g .d.lb{background:#fff5f5}.cal-g .lbn{display:block;font-size:10.5px;color:#dc2626;margin-top:3px;line-height:1.25}
.cal-g .kg{display:block;font-size:10.5px;border-radius:6px;padding:2px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal.mini .cal-g .lbn,.cal.mini .cal-g .kg{display:none}.cal.mini .cal-g .d.lb:after{content:"";position:absolute;left:6px;bottom:5px;width:5px;height:5px;border-radius:50%;background:#dc2626}
.kgdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cal-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.cal-g .c{position:absolute;right:8px;top:8px;background:var(--gold);color:var(--navy);font-weight:800;font-size:11.5px;border-radius:99px;padding:1px 8px}
.cal-g .nm{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cal-g .d.sel .nm{color:#dfe3f3}
.cal.mini .cal-g{gap:4px}.cal.mini .cal-g .d{min-height:40px;padding:5px 6px;border-radius:9px}.cal.mini .cal-g .n{font-size:12px}
.cal.mini .cal-g .c{right:4px;top:4px;font-size:10px;padding:0 6px}.cal.mini .cal-h b{font-size:14px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.cal-wrap>*{min-width:0}.cal-g .d{min-width:0;overflow:hidden}
.cal-side h4{margin:0 0 10px}.cal-side .ev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.cal-side .ev:hover{border-color:var(--navy)}.cal-side .ev small{color:var(--mut)}
.cal-stat{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.cal-stat div{background:var(--bg);border-radius:12px;padding:8px 14px}.cal-stat b{font-size:18px;margin-right:6px}
@media(max-width:900px){.cal-wrap{grid-template-columns:1fr}.cal-g .nm{display:none}.cal-g .d{min-height:52px}}
html,body{max-width:100%;overflow-x:hidden}
#login{display:flex;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:380px;margin:0!important}
@media(max-width:900px){.top .uname{display:none}.top{gap:8px}.side{gap:0}.card{min-width:0}.wrap>*{min-width:0}#prev{padding:8px}.paper{transform-origin:top left}.wz{padding:16px 6px}.wz-h{flex-direction:column}.wz-h h2{font-size:19px}.top h2{font-size:17px}.side .brand small{display:none}}
.wrap.wzmode{grid-template-columns:1fr}.wrap.wzmode>aside{display:none}
.docs button.pri{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.nav i{font-style:normal}.more-m,.back-m{display:none!important}

  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}

    flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;justify-content:space-around;gap:2px!important;

  body.menu-m .side .nav:not([hidden]),body.menu-m .side .brand{display:flex!important;flex:none;flex-direction:row;gap:12px;font-size:15px!important;padding:13px 14px!important;justify-content:flex-start;text-align:left}

  body.menu-m .side .foot{display:flex!important}
  body.menu-m .side .nav i{font-size:17px;width:22px;text-align:center}
  body.menu-m .side .nav:not([hidden]){margin:1px 0!important;min-height:0}
