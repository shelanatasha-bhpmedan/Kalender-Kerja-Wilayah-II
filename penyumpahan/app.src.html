<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumen Penyumpahan BHP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="if(matchMedia('(min-width:901px)').matches)this.media='all'">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c1f2e;--mut:#6b7087;--line:#e3e5ef;--pri:#4f46e5;--pri2:#eef0ff;--ok:#0f9d6b;--warn:#c2410c;--rad:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;display:flex;gap:8px;align-items:center}
header h1 span{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.lfil{display:grid;grid-template-columns:1fr;gap:6px;margin:0 0 10px}.lfil #fGrp,.lfil #fBln{grid-column:1/-1}.lfil select{font-size:12.5px;padding:7px 8px;border-radius:9px;min-width:0}
.lgrp{position:sticky;top:0;z-index:1;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 2px 4px;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;border-bottom:1px solid var(--line)}
.lgrp.sub2{padding-left:12px}.lgrp.sub{position:static;text-transform:none;letter-spacing:0;font-weight:600;border-bottom:0;padding:4px 2px 0}.lgrp i{font-style:normal;background:var(--line);border-radius:20px;padding:1px 8px;font-size:11px}
.lurah-box{font-size:12.5px;margin-top:-4px}.lurah-box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .meta-l{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
.item{padding:10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.item.on{border-color:var(--pri);background:var(--pri2)}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.pchip{padding:3px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:#fff;cursor:pointer}.pchip.on{background:#1c2340;color:#fff;border-color:transparent}.pchip.on small{color:#fff}.pgrp{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 2px 2px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}.item b{display:block;font-size:13px}.item small{color:var(--mut)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border-radius:99px;font-size:13px}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h3{margin:4px 0 12px;font-size:15px}
.hint{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:#fff}
.child{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.child.dewasa{opacity:.62;background:color-mix(in srgb,var(--line) 35%,transparent)}
.child .badge-dw{grid-column:1/-1;justify-self:start;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;background:#fde7e7;color:#a32020}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.doc b{font-size:13px}.doc div{display:flex;gap:6px}
.doc button{flex:1;padding:6px;font-size:12px}
#prev{background:#8a8fa3;padding:20px;border-radius:var(--rad);overflow:auto;max-height:80vh}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 20px;padding:1cm 2cm 2.5cm 3cm;font:12pt/1.5 Arial,"Liberation Sans",Helvetica,sans-serif;box-shadow:0 4px 20px #0003}
.paper p{margin:0;text-align:justify;text-indent:36pt}.paper p[data-line]{border-bottom:1px dotted #000;min-height:24pt;line-height:24pt;margin-right:0}
.paper p.ni,.paper p.ctr{text-indent:0}.paper p.ctr,.paper .ctr{text-align:center}
table.kop{width:100%;border-collapse:collapse;border-bottom:.5pt solid #000;margin:0 0 12pt}
.paper table.hd td:first-child{padding-left:0}.paper table.hd td:last-child{padding-right:0}
table.kop td{padding:0 0 3pt;vertical-align:middle}
table.kop td.lg{width:62pt;padding:0}
table.kop td.lg img{width:58pt;height:65pt;display:block}
table.kop td.tx{text-align:center;line-height:1.15;font-size:12pt}
table.kop .b{font-weight:bold}table.kop .s{font-size:10pt}
.paper table{border-collapse:collapse}.paper td{vertical-align:top;padding:1pt 4pt}
.ctr{text-align:center}.ttd{width:100%;margin-top:20pt}.ttd td{width:50%;text-align:left}.ttd.ctr td{text-align:center}.paper ul.dash{list-style:none;padding-left:18pt}.paper ul.dash li::before{content:'-';display:inline-block;width:18pt;margin-left:-18pt}
.paper ol{margin:0 0 8pt;padding-left:18pt}.paper ol li{padding-left:0}.paper p[data-n]{padding-left:18pt;text-indent:-18pt}.paper p[data-n]::before{content:attr(data-n);display:inline-block;width:18pt;text-indent:0}.paper p[data-b]::before{font-weight:bold}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media print{@page{size:A4;margin:0}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}.paper{box-shadow:none;margin:0;page-break-after:always}}
body.locked header,body.locked .wrap{display:none}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:0 16px}
.log{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.logi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ld{margin-top:4px;font-size:13px}.dif{margin:0;padding-left:18px}
del{color:#b91c1c;text-decoration:line-through}ins{color:#047857;text-decoration:none;font-weight:600}
.meta{font-size:12px;color:var(--mut)}
.nomor{font-size:12px;padding:6px 8px;border-radius:8px;background:var(--pri2)}
.kurang{font-size:11px;color:var(--warn)}
/* ===== tema e-Office BHP Medan ===== */
:root{--navy:#1b2345;--navy2:#252f5c;--gold:#f6c343;--gold2:#fff6db;--pri:#1b2345;--pri2:#eef1f9;--bg:#f3f4f8;--line:#e4e7ef;--rad:16px}
body{padding-left:250px}
.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#cfd5ea;display:flex;flex-direction:column;z-index:10;overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid #ffffff14}
.side .brand img{width:38px;height:42px;object-fit:contain}.side .brand b{display:block;color:#fff;font-size:16px;letter-spacing:.3px}.side .brand small{font-size:11.5px;opacity:.75}
.side .sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;opacity:.55;padding:18px 20px 6px}
.side .nav{display:flex;gap:10px;align-items:center;margin:2px 12px;padding:11px 14px;border-radius:12px;color:#e8ebf7;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.side .nav:hover{background:#ffffff12}.side .nav.on{background:var(--gold);color:var(--navy);box-shadow:0 6px 18px #f6c34355}
.side .foot{margin-top:auto;padding:16px 20px;font-size:11px;opacity:.6;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}
.side .foot button{background:none;border:0;color:inherit;padding:0;font-size:14px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;gap:14px;align-items:center}
.top h2{margin:0;font-size:20px}.top small{color:var(--mut)}.top .grow{margin-right:auto}
.top #q{width:220px;border-radius:99px;padding:9px 16px}
#who{display:flex;gap:10px;align-items:center}
.uname{text-align:right;line-height:1.2}.uname b{display:block;font-size:13px;text-transform:uppercase}.uname small{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}
.menubtn{background:var(--navy)!important;color:#fff!important;border:0!important;border-radius:99px!important;padding:9px 16px!important}
.pri,button.pri,label.pri{background:var(--gold)!important;color:var(--navy)!important;border-color:var(--gold)!important;font-weight:700}
.pri:hover{filter:brightness(.97);box-shadow:0 6px 16px #f6c34366}
.steps button.on{background:var(--navy);border-color:var(--navy)}
.seg button.on{background:var(--navy)}
.item.on{border-color:var(--navy);background:var(--pri2)}
.tag{background:var(--gold2);color:#8a6200}
.wrap{padding:22px 26px;max-width:1500px;margin:0}
.card{border-radius:var(--rad);box-shadow:0 1px 3px #1b234510}
/* wizard */
.wz{max-width:880px;margin:0 auto;padding:30px 34px}
.wz-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.wz-h h2{margin:0 0 4px;font-size:22px}.wz-h p{margin:0;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--pri2);color:var(--mut);font-size:14px}
.stepper i.on{background:var(--navy);color:#fff}.stepper i.done{background:var(--gold);color:var(--navy)}
.stepper s{width:22px;height:2px;background:var(--line);text-decoration:none}
.wz h4{font-size:15px;margin:0 0 14px;display:flex;gap:8px;align-items:center}
.wz .lbl{font-weight:700;font-size:13px;margin:18px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;position:relative;transition:.15s}
.opt:hover{border-color:#c5cbe0}.opt.on{border-color:var(--navy);background:var(--pri2)}
.opt b{display:block;margin-bottom:4px}.opt span{font-size:12.5px;color:var(--mut)}
.opt:after{content:"";position:absolute;right:16px;top:16px;width:16px;height:16px;border-radius:50%;border:2px solid #b8bfd4}
.opt.on:after{border:5px solid var(--navy)}
.drop{margin-top:6px;border:2px dashed #c5cbe0;border-radius:16px;padding:38px 20px;text-align:center;cursor:pointer;background:var(--bg);transition:.15s;display:block}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--pri2)}
.drop .ic{font-size:40px}.drop b{display:block;font-size:16px;margin:8px 0 4px}.drop small{color:var(--mut)}
.wz-f{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.wz-f .pri{padding:11px 20px;border-radius:12px}
.link{background:none!important;border:0!important;color:var(--mut)!important;text-decoration:underline;padding:0!important}
.spin{width:38px;height:38px;border:4px solid var(--pri2);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.dash .card b{font-size:26px;display:block}.dash .card span{color:var(--mut);font-size:12.5px}
#login{background:radial-gradient(circle at 20% 10%,#2c3972,var(--navy) 70%)}
#login form{border:0;box-shadow:0 30px 60px #0005}
@media(max-width:900px){body{padding-left:0}.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .sec,.side .foot{display:none}.side .brand{border:0;padding:12px}.side .nav{margin:4px;padding:8px 10px;font-size:13px}.top{flex-wrap:wrap;padding:12px 16px}.top #q{width:100%}.wrap{padding:14px}.opts,.dash{grid-template-columns:1fr}.wz{padding:20px}}
[hidden]{display:none!important}
/* pengecekan */
.bad input,.bad select,.bad textarea{border-color:#e5484d!important;background:#fff5f5!important}
.bad label:after{content:" ⚠";color:#e5484d}
.warnf input,.warnf select,.warnf textarea{border-color:#f5a524!important;background:#fffaf0!important}
.warnf label:after{content:" ⚠";color:#d98a00}
.fmsg{display:block;font-size:11.5px;margin-top:3px;color:#c2272d}.warnf .fmsg{color:#a86a00}
.steps button{position:relative}.steps .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;font-size:10.5px;line-height:18px;padding:0 5px;color:#fff;background:#e5484d;font-weight:700}
.steps .dot.w{background:#f5a524}
.cekbar{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;cursor:pointer}
.cekbar.e{background:#fdecec;color:#9b1c1f;border:1px solid #f3b4b4}.cekbar.w{background:#fff6e0;color:#7a5200;border:1px solid #f2d38a}.cekbar.ok{background:#e9f8f1;color:#0b6b48;border:1px solid #b5e5cf;cursor:default}
.ceklist{margin:0;padding:0;list-style:none}.ceklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ceklist .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;color:#fff}.ceklist .ic.e{background:#e5484d}.ceklist .ic.w{background:#f5a524}
.ceklist a{margin-left:auto;font-size:12px;color:var(--navy);cursor:pointer;white-space:nowrap;text-decoration:underline}
/* paket berkas */
.paket{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:linear-gradient(180deg,var(--pri2),var(--card) 60%)}
.paket-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.paket-h>div:first-child{margin-right:auto}
.prog{width:140px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.paket-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.paket-c h5{margin:0 0 8px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.pk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:400}
.pk:hover{border-color:var(--navy)}.pk input{width:auto;margin-top:3px}.pk b{display:block;font-size:13.5px}.pk small{color:var(--mut);font-size:11.5px}
.pk.ok{border-color:#b5e5cf;background:#f1fbf6}
@media(max-width:900px){.paket-g{grid-template-columns:1fr}}
/* kalender */
.cal{user-select:none}.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cal-h b{font-size:17px;margin-right:auto}
.cal-h button{border-radius:10px;padding:7px 12px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-g .hd{font-size:11px;font-weight:700;color:var(--mut);text-align:center;letter-spacing:.5px;padding:4px 0}
.cal-g .d{border:1px solid var(--line);border-radius:12px;min-height:78px;padding:8px;cursor:pointer;position:relative;background:var(--card);transition:.12s}
.cal-g .d:hover{border-color:var(--navy);box-shadow:0 4px 14px #1b234514}
.cal-g .d.x{opacity:.35}.cal-g .d.we{background:var(--bg)}.cal-g .d.td{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-g .d.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal-g .n{font-weight:700;font-size:13px}
.cal-g .d.lb .n{color:#dc2626}.cal-g .d.lb{background:#fff5f5}.cal-g .lbn{display:block;font-size:10.5px;color:#dc2626;margin-top:3px;line-height:1.25}
.cal-g .kg{display:block;font-size:10.5px;border-radius:6px;padding:2px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal.mini .cal-g .lbn,.cal.mini .cal-g .kg{display:none}.cal.mini .cal-g .d.lb:after{content:"";position:absolute;left:6px;bottom:5px;width:5px;height:5px;border-radius:50%;background:#dc2626}
.kgdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cal-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.cal-g .c{position:absolute;right:8px;top:8px;background:var(--gold);color:var(--navy);font-weight:800;font-size:11.5px;border-radius:99px;padding:1px 8px}
.cal-g .nm{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cal-g .d.sel .nm{color:#dfe3f3}
.cal.mini .cal-g{gap:4px}.cal.mini .cal-g .d{min-height:40px;padding:5px 6px;border-radius:9px}.cal.mini .cal-g .n{font-size:12px}
.cal.mini .cal-g .c{right:4px;top:4px;font-size:10px;padding:0 6px}.cal.mini .cal-h b{font-size:14px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.cal-wrap>*{min-width:0}.cal-g .d{min-width:0;overflow:hidden}
.cal-side h4{margin:0 0 10px}.cal-side .ev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.cal-side .ev:hover{border-color:var(--navy)}.cal-side .ev small{color:var(--mut)}
.cal-stat{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.cal-stat div{background:var(--bg);border-radius:12px;padding:8px 14px}.cal-stat b{font-size:18px;margin-right:6px}
@media(max-width:900px){.cal-wrap{grid-template-columns:1fr}.cal-g .nm{display:none}.cal-g .d{min-height:52px}}
html,body{max-width:100%;overflow-x:hidden}
#login{display:flex;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:380px;margin:0!important}
@media(max-width:900px){.top .uname{display:none}.top{gap:8px}.side{gap:0}.card{min-width:0}.wrap>*{min-width:0}#prev{padding:8px}.paper{transform-origin:top left}.wz{padding:16px 6px}.wz-h{flex-direction:column}.wz-h h2{font-size:19px}.top h2{font-size:17px}.side .brand small{display:none}}
.wrap.wzmode{grid-template-columns:1fr}.wrap.wzmode>aside{display:none}
.docs button.pri{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.nav i{font-style:normal}.more-m,.back-m{display:none!important}
/* ===== Mode HP: bar atas ringkas + navigasi bawah (menu "Lainnya" jadi lembar dari bawah) ===== */
@media(max-width:900px){
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .side{position:fixed!important;left:0;right:0;bottom:0;top:auto;width:auto;height:calc(64px + env(safe-area-inset-bottom));z-index:30;
    flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;justify-content:space-around;gap:2px!important;
    padding:5px 6px calc(5px + env(safe-area-inset-bottom));overflow:hidden;box-shadow:0 -4px 16px #0002}

/* ---------------- util tanggal & terbilang ---------------- */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function today(){const d=new Date(Date.now()+7*3600e3);return d.toISOString().slice(0,10)}
function pd(s){if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function tgl(s){const d=pd(s);return d?`${String(d.getDate()).padStart(2,'0')} ${BLN[d.getMonth()]} ${d.getFullYear()}`:'…'}
function hari(s){const d=pd(s);return d?HARI[d.getDay()]:'…'}
function usia(s,ref){const d=pd(s);if(!d)return'…';const r=pd(ref)||new Date();let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u+' Tahun'}
function umurTh(s,ref){const d=pd(s);if(!d)return null;const r=pd(ref)||new Date();let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u}
/* ---- filter kelayakan perwalian ---- */
const BATAS_DEWASA=17;
const MILITER=/\b(TNI|ABRI|tentara|prajurit|militer|angkatan\s+(darat|laut|udara)|kodim|korem|kodam|koramil|lanud|lantamal|yonif|kostrad|ASABRI|polri|kepolisian|polisi|bhayangkara|brimob|bintara|tamtama|perwira)\b/i;
/* usia dihitung pada tanggal sumpah (atau hari ini bila belum dijadwalkan) */
function anakDewasa(a,r){const u=umurTh(a&&a.tglLahir,(r&&r.tglSumpah)||(r&&(k=>k&&k.mulai)(kunjKepri(r)))||today());return u!==null&&u>=BATAS_DEWASA}
function anakWali(r){if(r.jenis!=='Perwalian')return[];
  return (r.anak||[]).filter(a=>a.nama&&a.wali!=='Tidak'&&!anakDewasa(a,r))}
function cekKelayakan(r){const tolak=[],info=[];if(!r||r.jenis!=='Perwalian')return{tolak,info};
  const ref=r.tglSumpah||today(),A=(r.anak||[]).filter(a=>a&&a.nama&&a.wali!=='Tidak'&&a.diwalikan!==false);
  const um=A.map(a=>({a,u:umurTh(a.tglLahir,ref)})),besar=um.filter(x=>x.u!==null&&x.u>=BATAS_DEWASA);
  if(A.length&&besar.length===A.length)info.push(besar.every(x=>x.u>=18)?'Seluruh anak sudah DEWASA (18 tahun ke atas).':'Seluruh anak sudah HAMPIR DEWASA ('+BATAS_DEWASA+' tahun ke atas).');
  else if(besar.length)info.push('Anak yang sudah '+BATAS_DEWASA+' tahun ke atas tidak dimasukkan (hanya anak yang lebih kecil): '+besar.map(x=>x.a.nama+' ('+x.u+' th)').join(', ')+'.');
  const teks=[r.pekerjaan,r.alasan,r.ketMeninggal,r.terkaitMiliter,r.isiBap].join('.\n').replace(/[^.;\n]*(SKCK|catatan kepolisian|kepolisian (negara|resor|daerah|sektor)|polres|polda|polsek)[^.;\n]*/gi,' ');
  const m=teks.match(MILITER);if(m||r.terkaitMiliter)tolak.push('Terkait TNI/Polri/ASABRI'+(m?' (ditemukan kata "'+m[0]+'")':'')+(r.terkaitMiliter?': '+r.terkaitMiliter:'')+'. Alasan: permohonan perwalian yang berkaitan dengan anggota TNI/Polri atau hak ASABRI tidak dilayani penyumpahan/pengawasannya oleh Balai Harta Peninggalan Medan sesuai kebijakan layanan BHP Medan.');
  if(r.orangTuaHidup===true||r.orangTuaHidup==='Ya')tolak.push('Kedua orang tua anak masih hidup. Alasan: sesuai Pasal 47 ayat (1) dan (2) serta Pasal 50 ayat (1) UU No. 1 Tahun 1974 tentang Perkawinan, anak yang kedua orang tuanya masih hidup berada di bawah kekuasaan orang tua, bukan di bawah perwalian, sehingga tidak ada perwalian yang diawasi BHP selaku Wali Pengawas (Pasal 366 KUHPerdata).');
  else if(!r.tglMeninggalPasangan&&!r.ketMeninggal&&!/meninggal|wafat|almarhum/i.test((r.isiBap||'')+(r.pasangan||''))&&r.orangTuaHidup!==false&&r.orangTuaHidup!=='Tidak')info.push('Belum ada data kematian orang tua anak — pastikan salah satu/kedua orang tua sudah meninggal.');
  return{tolak,info}}
function bannerKelayakan(r,full){const k=cekKelayakan(r);if(!k.tolak.length&&!k.info.length)return'';
  return`<div class="full" style="border-radius:10px;padding:10px 12px;margin-bottom:10px;${k.tolak.length?'background:#fdecea;border:1px solid #e74c3c;color:#922':'background:#fff6db;border:1px solid #f6c343;color:#7a5a00'}">${k.tolak.length?'<b>⛔ DITOLAK OTOMATIS — alasan penolakan:</b><ol style="margin:4px 0 0 18px;padding:0">'+k.tolak.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>':''}${k.tolak.length&&k.info.length?'<br>':''}${k.info.map(x=>'⚠️ '+esc(x)).join('<br>')}</div>`}
function terbilang(n){const s=['','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas'];
  if(n<12)return s[n];if(n<20)return terbilang(n-10)+' Belas';if(n<100)return terbilang(Math.floor(n/10))+' Puluh '+terbilang(n%10);
  if(n<200)return'Seratus '+terbilang(n-100);if(n<1000)return terbilang(Math.floor(n/100))+' Ratus '+terbilang(n%100);
  if(n<2000)return'Seribu '+terbilang(n-1000);return terbilang(Math.floor(n/1000))+' Ribu '+terbilang(n%1000)}
const tb=n=>terbilang(n).replace(/\s+/g,' ').trim();
function tglBA(s){const d=pd(s);return d?`${HARI[d.getDay()]}, tanggal ${tb(d.getDate())} bulan ${BLN[d.getMonth()]} tahun ${tb(d.getFullYear())}`:'…'}
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=v=>v?esc(v):'<span style="background:#fde68a">……</span>';

/* ---------------- turunan ---------------- */
/* pejabat penanda tangan BA Sumpah / BA Inventarisasi / BAP: Kurator Keperdataan minimal Ahli Muda (Muda, Madya, Utama) atau Kepala Seksi Harta Peninggalan */
const pjJab=p=>String(p&&p.jabatan||'').toLowerCase().replace(/\s+/g,' ');
const pjKurator=p=>/kurator/.test(pjJab(p))&&/ahli\s*(muda|madya|utama)/.test(pjJab(p));
const pjKasi=p=>/(kepala\s*seksi|kasi\b).*(harta\s*peninggalan|\bhp\b|wilayah)|harta\s*peninggalan.*kepala\s*seksi/.test(pjJab(p))&&!/pelaksana|staf|staff/.test(pjJab(p));
const pjLayak=p=>!!p&&!!p.nama&&(pjKurator(p)||pjKasi(p));
function pjOptLayak(v){const P=SET.pejabat||[],c=pjCari(v).nama,ur=(a,b)=>String(a.nama).localeCompare(b.nama);
  const k=P.filter(pjKurator).sort(ur),h=P.filter(p=>pjKasi(p)&&!pjKurator(p)).sort(ur),lain=P.filter(p=>!pjLayak(p)&&p.nama===c);
  const o=p=>`<option ${p.nama===c?'selected':''} value="${esc(p.nama)}">${esc(p.nama||'(isi di Pengaturan)')} — ${esc(p.jabatan||'')}${p.nip?'':' (NIP kosong)'}</option>`;
  return (k.length?`<optgroup label="Kurator Keperdataan (Ahli Muda ke atas)">${k.map(o).join('')}</optgroup>`:'')+(h.length?`<optgroup label="Kepala Seksi Harta Peninggalan">${h.map(o).join('')}</optgroup>`:'')
    +(lain.length?`<optgroup label="⚠ Tidak memenuhi syarat jabatan">${lain.map(o).join('')}</optgroup>`:'')
    +((k.length+h.length+lain.length)?'':P.map(o).join(''))}
const pjPeringatan=v=>{const x=pjCari(v);return x.nama&&!pjLayak(x)&&(SET.pejabat||[]).some(pjLayak)?`<small class="fmsg">Jabatan "${esc(x.jabatan||'-')}" tidak memenuhi syarat (Kurator Keperdataan min. Ahli Muda / Kepala Seksi Harta Peninggalan)</small>`:''};
/* pejabat tersimpan (mis. daftar lama 5 orang) dilengkapi dengan daftar pegawai bawaan: yang belum ada ditambah, NIP/jabatan kosong diisi */
function lengkapiPejabat(){const nz=x=>String(x||'').toUpperCase().replace(/[^A-Z]/g,''),P=SET.pejabat=Array.isArray(SET.pejabat)?SET.pejabat:[];
  DEF_SET.pejabat.forEach(d=>{const x=P.find(p=>nz(p.nama)===nz(d.nama));if(!x)P.push({...d});else{if(!x.nip)x.nip=d.nip;if(!x.jabatan||(!pjLayak(x)&&pjLayak(d)))x.jabatan=d.jabatan}})}
function pjCari(v){const P=SET.pejabat||[];if(typeof v==='number')return P[v]||{};const nz=x=>String(x||'').toUpperCase().replace(/[^A-Z]/g,'');return P.find(p=>p.nama===v)||P.find(p=>v&&nz(p.nama)===nz(v))||{nama:v||'',nip:'',jabatan:''}}
function derive(r){
  const w=r.jenis==='Perwalian', J=w?'Wali':'Pengampu';
  const sapa=r.jk==='Laki-laki'?'Bapak':'Ibu';
  const anak=w?anakWali(r):[];
  const objek=w?anak.map(a=>a.nama).join(', '):r.terampu.nama;
  const statusRel=(w?hubAnak(r.status):r.status)||(w?'Anak':'Keluarga');
  const kel=r.kelurahan||'';
  let laf=(SET.lafaz[r.agama]||SET.lafaz.Islam).replace('{JENIS}',w?'Perwalian':'Pengampuan')
    .replace('{STATUS}',statusRel.toLowerCase()).replace('{PENGADILAN}',r.pengadilan);
  return{w,J,sapa,objek,statusRel,kel,laf,madya:pjCari(r.madya),muda:pjCari(r.muda),anak,

const kop=()=>`<table class="kop"><tr><td class="lg"><img src="${SET.logo||LOGO_DEF}" width="77" height="87" alt="logo"></td><td class="tx">${esc(SET.instansi)}<br>${esc(SET.kanwil)}<br><span class="b">${esc(SET.balai)}</span><br><span class="s">${esc(SET.alamat)}<br>${esc(SET.telp)}<br>${esc(SET.web)}</span></td></tr></table>`;
/* ---------------- dokumen (sesuai template di folder Drive BHP Medan) ---------------- */
const WA=()=>`<b>${esc(SET.wa)}</b>`;
const ttdKepala=()=>`<p class="ni" data-keep="ttd" style="margin-left:262pt;margin-top:20pt;text-align:left">Kepala,<br><br><br><br>${esc(SET.kepala)}</p>`;
const lurahNm=r=>{const k=String(r.kelurahan||'').trim().replace(/^(Lurah|Kelurahan)\s+/i,'');return /^Desa\s/i.test(k)?'Kepala '+V(k):'Lurah '+V(k)};
/* tembusan kanwil mengikuti provinsi tempat tinggal (seperti format surat Padang → Kanwil Sumatera Barat); Sumatera Utara / tidak diketahui = Pengaturan */
const kanwilDef=r=>{const p=provinsiBerkas(r);return PROV_DATA[p]&&p!=='Sumatera Utara'?'Kepala Kantor Wilayah Kementerian Hukum '+p:SET.kanwilTembusan};
const kanwil=r=>r.kanwilTembusan||kanwilDef(r);
const tembusan=(r,lurah=true,pertinggal=false)=>`<p class="ni" data-keep="1" style="margin-top:22pt;font-size:8pt;line-height:1">Tembusan:</p><ol data-keep="1" style="font-size:8pt;line-height:1"><li>Direktur Jenderal Administrasi Hukum Umum Kementerian Hukum RI;</li><li>Direktur Perdata Direktorat Jenderal Administrasi Hukum Umum;</li><li>${esc(kanwil(r))}${lurah?';':''}</li>${lurah?`<li>${(t=>t?esc(t.jab):lurahNm(r))(tujuanSurat(r))}</li>`:''}</ol>`;
const penetapan=r=>`Menindaklanjuti Penetapan ${esc(r.pengadilan)} Nomor: ${V(r.nomorPenetapan)} tertanggal ${tgl(r.tglPenetapan)} yang telah memperoleh kekuatan hukum tetap`;
const blnThn=s=>{const d=pd(s);return d?`${BLN[d.getMonth()]} ${d.getFullYear()}`:'…'};
/* kota/kabupaten dari teks wilayah: hanya segmen yang diawali Kota/Kabupaten — nama kelurahan seperti "Kota Matsum I" tidak terambil */
function kotaKab(t){const seg=String(t||'').split(/[,;]/).map(x=>x.trim()).filter(x=>/^(Kota|Kabupaten|Kab\.)\s+\S/i.test(x));const m=seg.length&&seg[seg.length-1].match(/^(Kota|Kabupaten|Kab\.)\s+(.+)$/i);
  return m?{jenis:/^kab/i.test(m[1])?'Kabupaten':'Kota',nama:m[2].replace(/\s+/g,' ').replace(/[.\s]+$/,'').trim()}:null}
/* kota surat permohonan: isian petugas → kota/kabupaten tempat tinggal → Kepulauan Riau: kota data kantor / Batam → Medan */
const kota=r=>r.kotaPermohonan||(kotaKab(r.kelurahan)||kotaKab(r.alamat)||{}).nama||(isKepri(r)?((kotaKantor(r)||{}).kota||'Batam').replace(/^(Kota|Kabupaten)\s+/,''):'Medan');
/* alamat lengkap pemohon (wali/pengampu): alamat + kelurahan/kecamatan/kota bila belum tercantum */
function alamatLengkap(r){const a=String(r.alamat||'').trim().replace(/[\s.,;]+$/,''),k=String(r.kelurahan||'').trim().replace(/[\s.,;]+$/,'');if(!a||!k)return a||k;if(a.toLowerCase().includes(k.toLowerCase()))return a;
  const kn=k.match(/Kel(?:urahan)?\.?\s+([^,]+)/i);return kn&&a.toLowerCase().includes(kn[1].trim().toLowerCase())?a:a+', '+k}
const KANTOR_BHP=/balai harta peninggalan|\bbhp\b|jl\.?\s*listrik|jalan listrik/i;
const lokasiSumpah=r=>r.zoom?'zoom':KANTOR_BHP.test(String(r.tempat||''))?'kantor':'rumah';
const kalimatKegiatan=(r,s)=>({kantor:`Balai Harta Peninggalan Medan akan menyelenggarakan kegiatan Pengangkatan Sumpah tersebut di Kantor Balai Harta Peninggalan Medan pada:`,
  zoom:`Balai Harta Peninggalan Medan akan menyelenggarakan kegiatan Pengangkatan Sumpah tersebut secara virtual (daring) pada:`,
  rumah:`Tim Balai Harta Peninggalan Medan akan melakukan kunjungan untuk menyelenggarakan kegiatan Pengangkatan Sumpah tersebut di kediaman ${s} pada:`})[lokasiSumpah(r)];
const tempatSumpah=r=>String(r.tempat||'').trim()||alamatLengkap(r)||'Kediaman '+(r.nama||'');

function hubAnak(s){const h=String(s||'').trim(),l=h.toLowerCase().replace(/\s+/g,' '),k=/tiri/.test(l)?' Tiri':/angkat/.test(l)?' Angkat':' Kandung';
  if(/^(paman|bibi|om|tante|pakde|bude|pakcik|makcik|uwak|wak|tulang|amangboru|namboru|nantulang)\b/.test(l))return'Keponakan';

  if(/^(ayah|ibu|bapak|bapa|mama|papa|orang ?tua)\b/.test(l))return'Anak'+k;

function peranPemohon(status,jk,w){const s=String((w?hubAnak(status):status)||'').toLowerCase(),P=jk==='Perempuan';

    if(/adik/.test(s))return P?'kakak kandung perempuan':'kakak kandung laki-laki';if(/anak tiri/.test(s))return P?'ibu tiri':'ayah tiri';return s?`keluarga (${s})`:''}
  if(/suami/.test(s))return'istri';if(/istri/.test(s))return'suami';if(/ibu|ayah|orang ?tua/.test(s))return'anak kandung';if(/anak/.test(s))return P?'ibu kandung':'ayah kandung';

function buatBap(r){const d=derive(r),w=d.w,L=[],urut=x=>[...x].sort((a,b)=>String(a.tglLahir||'9').localeCompare(String(b.tglLahir||'9'))),semua=w?urut(r.anak.filter(a=>a.nama)):[],dw=urut(d.anak),t=r.terampu||{};

    else if(semua.length>dw.length){L.push(`Bahwa anak-anak yang berkaitan dengan permohonan ini berjumlah ${nTxt(semua.length)} orang, yaitu:`);semua.forEach(a=>L.push('- '+anakTxt(a,r)+';'))}
    if(r.tglMeninggalPasangan&&r.pasangan)L.push(`Bahwa **${r.pasangan.toUpperCase()}** telah meninggal dunia pada tanggal ${tgl(r.tglMeninggalPasangan)}${r.ketMeninggal?`, ${r.ketMeninggal}`:''};`);

const PROMPT_BAP=`Anda penyusun Berita Acara Penghadapan (BAP) pada Balai Harta Peninggalan Medan. Baca SELURUH penetapan pengadilan terlampir (identitas, duduk perkara, bukti surat, keterangan saksi, pertimbangan hukum, amar) lalu susun isi BAP berupa keterangan penghadap (= pemohon yang ditetapkan sebagai wali/pengampu) yang LENGKAP, TAJAM, RUNTUT dan MENGALIR — setiap butir menyambung logis dengan butir sebelumnya.
Urutan butir (lewati yang datanya tidak ada di penetapan):
1. Identitas lengkap penghadap: nama, NIK, tempat & tanggal lahir, usia, agama, pekerjaan, alamat lengkap; serta hubungan penghadap dengan anak/terampu.
2. Perkawinan penghadap: dengan siapa (identitas pasangan), kapan & di mana menikah, dasar Kutipan Akta Nikah/Akta Perkawinan (nomor, tanggal, instansi).
3. Anak-anak dari perkawinan tersebut: pengantar lalu satu sub-butir per anak (nama, jenis kelamin, tempat & tanggal lahir, usia, nomor akta kelahiran bila ada), urut dari yang tertua.
4. Meninggalnya pasangan/orang tua: tanggal, tempat, sebab bila disebut, dasar Akta/Surat Kematian (nomor, tanggal, instansi); akibat hukumnya terhadap anak.
5. Anak yang masih di bawah umur (belum 18 tahun/belum kawin) dan berada di bawah perwalian penghadap: sub-butir per anak.
   (Untuk Pengampuan ganti butir 2–5 dengan: identitas terampu, hubungan dengan penghadap, riwayat & kondisi kesehatan terampu, dasar surat keterangan dokter/rumah sakit, akibatnya terhadap kecakapan hukum terampu.)
6. Latar belakang dan alasan konkret mengajukan permohonan (kepentingan hukum yang hendak dilakukan, mis. mengurus/menjual/membalik nama aset, mencairkan dana, keperluan pendidikan/nafkah anak).
7. Harta kekayaan anak/terampu: pengantar lalu sub-butir per aset (jenis, luas, lokasi, nomor sertifikat/rekening, atas nama, asal-usul, nilai bila disebut); bila perlu sub-sub-butir untuk rincian.
8. Keterangan para saksi di persidangan: pengantar lalu sub-butir per saksi (nama, hubungan dengan penghadap, pokok keterangan yang relevan).
9. Penetapan pengadilan: nama pengadilan, nomor, tanggal, dan pokok amar yang menetapkan penghadap sebagai wali/pengampu (sebut nama anak/terampu).

FORMAT WAJIB:
- Satu butir per baris. Butir utama TANPA nomor, diawali kata "Bahwa". Sub-butir diawali "- " (tanpa huruf), sub-sub-butir diawali "-- ". Penomoran dibuat otomatis oleh aplikasi — jangan menulis nomor/huruf sendiri.
- Akhiri setiap butir/sub-butir dengan ";" kecuali butir paling akhir diakhiri ".".
- Nama orang dalam HURUF KAPITAL dan diapit ** ** (contoh **SITI AMINAH**). Sebut pemohon sebagai "penghadap".
- Untuk USIA jangan hitung sendiri: tulis [usia:YYYY-MM-DD] berisi tanggal lahir orangnya. Untuk tanggal tulis [tgl:YYYY-MM-DD].
- Bahasa Indonesia baku gaya berita acara resmi; kalimat padat, jelas, tidak berulang.
- HANYA fakta yang tertulis di penetapan. Jangan mengarang nomor, tanggal, nama, atau aset.
GAYA: tulis seperti petugas menceritakan kembali isi penetapan kepada orang awam — kronologis (siapa penghadap → keluarga/terampu → peristiwa yang melatarbelakangi → alasan permohonan → harta → saksi → penetapan → kesanggupan), satu gagasan per butir, kalimat aktif dan lugas, istilah hukum dijelaskan singkat bila perlu, tanpa pengulangan identitas yang sudah disebut (cukup sebut nama).
PANJANG: secukupnya namun tuntas — paling banyak ±40 baris dan setiap baris paling banyak ±70 kata, supaya jawaban tidak terpotong.
KEAMANAN FORMAT JSON (WAJIB): di dalam teks JANGAN memakai tanda petik ganda (") — pakai petik tunggal ‘…’ bila perlu mengutip; JANGAN ada baris baru, tab, garis miring terbalik, atau kurung kurawal { } di dalam teks.
Balas satu objek JSON saja, tanpa penjelasan: {"isiBap":["baris 1","baris 2"]}`;

const ANTRE_SIMPAN=new WeakMap();/* simpan per berkas berurutan — dua pengisian otomatis pada berkas yang sama tidak saling bentrok */
function simpanRec(r){if(r===cur)return save();const p=(ANTRE_SIMPAN.get(r)||Promise.resolve()).then(()=>{const js=JSON.stringify(r);return api('apiSimpan',JSON.parse(js),r._versi).then(x=>{if(x&&!x.konflik){r._versi=x.versi;DASAR.set(r,js)}else if(x&&x.konflik)toast('Berkas '+(r.nama||'')+' diubah orang lain — isian otomatis tidak tersimpan, buka ulang aplikasi')})}).catch(e=>toast(e.message));ANTRE_SIMPAN.set(r,p);return p}
/* DASAR = isi berkas terakhir yang sama dengan server. Bila berkas ternyata diubah orang lain (bentrok), perubahan kita
   (beda dari DASAR) digabung ke data server — isian orang lain tidak ditimpa dan isian baru kita tidak dibuang */
const DASAR=new WeakMap();
const pakaiDB=L=>{DB=L;DB.forEach(r=>DASAR.set(r,JSON.stringify(r)))};
const samaNilai=(a,b)=>JSON.stringify(a??'')===JSON.stringify(b??'');
const objPolos=v=>v&&typeof v==='object'&&!Array.isArray(v);
function gabung3(b,l,s,jalur,bentrok){
  if(samaNilai(l,b))return s;if(samaNilai(s,b)||samaNilai(s,l))return l;
  if(objPolos(l)&&objPolos(s)){const o={};new Set([...Object.keys(l),...Object.keys(s)]).forEach(k=>{const v=k[0]==='_'?s[k]:gabung3(objPolos(b)?b[k]:undefined,l[k],s[k],jalur?jalur+'.'+k:k,bentrok);if(v!==undefined)o[k]=v});return o}
  bentrok.push({path:jalur,lama:l,baru:s});return s}
function gabungBentrok(r0,s){const b=DASAR.has(r0)?JSON.parse(DASAR.get(r0)):null;if(!b)return{rec:s,bentrok:[],dibuang:true};
  const L=JSON.parse(JSON.stringify(r0)),bentrok=[];delete L.asal;
  const m=gabung3(b,L,s,'',bentrok);m._versi=s._versi;m._meta=s._meta;return{rec:m,bentrok}}
async function flush(){if(!cur)return;if(saving){again=true;return}saving=true;const r0=cur;
  try{const js=JSON.stringify(r0),r=await api('apiSimpan',JSON.parse(js),r0._versi);
    if(r.konflik){const s=r.server,g=gabungBentrok(r0,s),i=DB.indexOf(r0);DASAR.set(g.rec,JSON.stringify(s));if(i>=0)DB[i]=g.rec;
      if(g.dibuang)alert(`Berkas ini baru saja diubah oleh ${r.oleh}. Data terbaru dimuat ulang; ulangi perubahan Anda bila perlu.`);
      else{const perlu=!samaNilai(g.rec,s);
        if(g.bentrok.length)alert(`Berkas ini juga diubah oleh ${r.oleh} pada saat yang sama. Isian Anda digabung dengan isiannya, tidak ada data yang dihapus.\n\nKolom berikut diubah kalian berdua — dipakai isian ${r.oleh}:\n`+g.bentrok.map(x=>`• ${fLbl(x.path)}: isian Anda "${String(x.lama??'').slice(0,80)}"`).join('\n')+'\n\nUbah lagi bila isian Anda yang benar.');
        else toast(`Berkas juga diubah oleh ${r.oleh} — isian Anda digabung, tidak ada yang hilang`);
        if(perlu){if(cur===r0){cur=g.rec;save()}else simpanRec(g.rec)}}
      if(cur===r0)cur=g.rec;renderMain();renderList()}
    else{r0._versi=r.versi;DASAR.set(r0,js);if(r.diubahOleh)r0._meta={...(r0._meta||{dibuatOleh:ME.nama,dibuatPada:r.diubahPada}),diubahOleh:r.diubahOleh,diubahPada:r.diubahPada};delete r0.asal;setStat('✓ Tersimpan')}}
  catch(e){setStat('⚠ Gagal menyimpan');toast(e.message)}
  saving=false;if(again){again=false;flush()}}

function umurPada(lahir,ref){const d=pd(lahir),r=pd(ref)||new Date();if(!d)return null;let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u}
function cekData(r){const w=[],t=today(),ref=r.tglSumpah||t;
  if(r.nomorPenetapan&&!/^\d+\s*\/\s*Pdt\.?\s*P\s*\/\s*\d{4}\s*\/\s*(PN|PA|MS)/i.test(r.nomorPenetapan))w.push('Format nomor penetapan tidak lazim: '+r.nomorPenetapan);
  if(r.tglPenetapan&&r.tglPenetapan>t)w.push('Tanggal penetapan di masa depan');
  if(r.tglPenetapan&&r.tglSumpah&&r.tglSumpah<r.tglPenetapan)w.push('Tanggal sumpah lebih awal dari tanggal penetapan');
  const up=umurPada(r.tglLahir,ref);if(up!==null&&(up<18||up>100))w.push('Umur pemohon '+up+' tahun — periksa tanggal lahir');
  if(r.nik&&!/^\d{16}$/.test(String(r.nik).replace(/\s/g,'')))w.push('NIK harus 16 digit');
  if(r.jenis==='Perwalian'){(r.anak||[]).filter(a=>a.nama).forEach(a=>{const u=umurPada(a.tglLahir,ref);if(u!==null&&u>=18)w.push(`Anak ${a.nama} sudah ${u} tahun — perwalian untuk anak di bawah umur`);if(!a.tglLahir)w.push(`Tanggal lahir anak ${a.nama} kosong`)});
    if(r.nama&&(r.anak||[]).some(a=>a.nama===r.nama))w.push('Nama wali sama dengan nama anak — periksa')}
  else{const u=umurPada(r.terampu&&r.terampu.tglLahir,ref);if(u!==null&&u<18)w.push('Terampu berumur '+u+' tahun — pengampuan untuk orang dewasa');if(r.terampu&&r.nama&&r.terampu.nama===r.nama)w.push('Nama pengampu sama dengan terampu — periksa')}
  if(!tujuanSurat(r))w.push('Kelurahan/kecamatan tempat tinggal '+(r.jenis==='Perwalian'?'wali':'pengampu')+' kosong — Surat ke Lurah/Camat belum bisa dibuat');
  return w}

  if(SURAT_ANTAR.includes(k)){need(r.nama,'Nama '+d.J);if(!tujuanSurat(r))m.push('Kelurahan/kecamatan tempat tinggal '+d.J);else if(k!=='lurah'&&k!=='desa')need(alamatEf(r),'Alamat '+d.J);
    if(k==='undangan'&&!kunjKepri(r))need(r.tglSumpah,'Tanggal sumpah');need(r.tanggalSurat,'Tanggal surat');return m}
  need(r.pengadilan,'Pengadilan');need(r.nomorPenetapan,'Nomor penetapan');need(r.tglPenetapan,'Tanggal penetapan');need(r.nama,'Nama '+d.J);need(r.alamat,'Alamat');need(r.kelurahan,'Kelurahan');need(r.tglSumpah,'Tanggal sumpah');need(r.waktu,'Waktu');
  if(d.w){if(!d.anak.length)m.push('Data anak')}else need(r.terampu.nama,'Nama terampu');
  if(['surat','lurah','undangan','desa'].includes(k))need(r.tanggalSurat,'Tanggal surat');
  if(k==='terima'){need(r.nik,'NIK');need(r.madya,'Pejabat penyumpah')}
  if(k==='ba'){need(r.tglLahir,'Tgl lahir '+d.J);need(r.agama,'Agama');need(r.pekerjaan,'Pekerjaan');need(r.status,'Hubungan');need(d.madya.nama,'Nama pejabat madya');need(d.madya.nip,'NIP pejabat madya');
    if(d.w)d.anak.forEach((a,i)=>need(a.tglLahir,`Tgl lahir anak ${i+1}`));else{need(r.terampu.tglLahir,'Tgl lahir terampu');need(r.terampu.kondisi,'Kondisi medis')}}
  if(k==='harta'){need(d.muda.nama,'Nama pejabat inventarisasi');need(d.muda.nip,'NIP pejabat inventarisasi');need(r.tglLahir,'Tgl lahir '+d.J);need(r.pekerjaan,'Pekerjaan')}
  if(k==='bap'){const p=bapP(r);need(p.nama,'Nama pejabat BAP');need(p.nip,'NIP pejabat BAP');need(r.tglLahir,'Tgl lahir '+d.J);need(r.pekerjaan,'Pekerjaan')}
  return m}
/* isian surat antar yang masih kosong tetapi tidak menghalangi */
function kosongSurat(k,r){if(!SURAT_ANTAR.includes(k))return[];const d=derive(r),m=[];const need=(v,l)=>{if(!String(v??'').trim())m.push(l)};
  need(r.pengadilan,'Pengadilan');need(r.nomorPenetapan,'Nomor penetapan');need(r.tglPenetapan,'Tanggal penetapan');if(k!=='undangan'&&!kunjKepri(r)&&!tanpaJadwal(r))need(r.tglSumpah,'Tanggal sumpah');if(k==='undangan'||!tanpaJadwal(r))need(r.waktu,'Waktu');
  if(d.w){if(!d.anak.length)m.push('Data anak')}else need(r.terampu&&r.terampu.nama,'Nama terampu');return m}
const kosongGrup=(g,r)=>[...new Set(GRUP[g].keys.flatMap(k=>kosongSurat(k,r)))];
function infoNomor(k,r){const d=derive(r);return{kurang:kurang(k,r),
  perihal:{surat:`Pengambilan Sumpah dan Inventarisasi Harta an. ${d.J} ${r.nama}`,lurah:`Koordinasi Terkait Pengambilan Sumpah dan Inventarisasi Harta an. ${d.J} ${r.nama}`,undangan:`Undangan Pengambilan Sumpah ${d.J} an. ${r.nama}`,desa:`Undangan Menghadiri Pengambilan Sumpah ${d.J} an. ${r.nama}`,bap:`Berita Acara Penghadapan ${d.jenisTxt} an. ${r.nama}`,ba:`Berita Acara Penyumpahan ${d.jenisTxt} an. ${r.nama}`,harta:`Berita Acara Pencatatan Harta ${d.jenisTxt} an. ${r.nama}`}[k],
  tujuan:k==='lurah'||k==='desa'?(t=>t?t.jab:'Lurah '+r.kelurahan)(tujuanSurat(r)):r.nama,tanggal:['surat','lurah','undangan','desa'].includes(k)?r.tanggalSurat:r.tglSumpah}}
async function ambilNomor(k,btn){const inf=infoNomor(k,cur);if(inf.kurang.length){alert('Lengkapi dulu: '+inf.kurang.join(', '));return}
  const tn=await tanyaTglNomor([k]);if(!tn)return;inf.tanggalNomor=tn;
  btn.disabled=true;btn.textContent='Menghubungi SPS…';clearTimeout(saveT);await flush();
  try{const r=await api('apiAmbilNomor',cur.id,NOMOR[k],inf);cur[NOMOR[k]]=r.nomor;cur._versi=r.versi;if(r.tanggalSurat)cur.tanggalSurat=r.tanggalSurat;toast('Nomor: '+r.nomor);renderMain()}
  catch(e){const sdh=nomorSudahAda(e);if(sdh){cur[NOMOR[k]]=sdh;toast('Sudah bernomor: '+sdh+' (tidak diambil lagi)');renderMain();return}alert('Gagal mengambil nomor: '+(e.message||e));btn.disabled=false;btn.textContent='🔢 Ambil nomor SPS'}}

function tglNomorDipilih(){const v=($('#tglNomor')||{}).value||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){toast('Pilih tanggal nomor');return null}if(v>today()){toast('SPS tidak bisa tanggal yang akan datang');return null}return v}

/* ===== Pembaca dokumen tahan watermark =====
   Watermark direktori putusan MA ("Mahkamah Agung Republik Indonesia" miring, besar, samar), kop "Direktori Putusan…",
   nomor halaman dan blok Disclaimer dibuang sebelum teks dipakai parser maupun dikirim ke AI sebagai pendamping. */
const WM_BARIS=[/^Direktori Putusan Mahkamah Agung Republik Indonesia$/i,/^putusan\.mahkamahagung\.go\.id$/i,/^Halaman \d+( dari \d+)?(\s+(Penetapan|Putusan)\b.*)?$/i,
  /^Disclaimer$/i,/^Kepaniteraan Mahkamah Agung Republik Indonesia berusaha/i,/^pelaksanaan fungsi peradilan/i,/^Dalam hal Anda menemukan inakurasi/i,
  /^masih terdapat kemungkinan/i,/^Email\s*:\s*kepaniteraan@/i,/^(M|Ma|Mah|Mahk|Mahka|Mahkam|Mahkama)?h?(kamah|amah|mah|ah)?\s*Agung\s*Repub(lik)?(\s*Indonesi?a?)?$/i,/^R?e?p?u?b?lik Indonesi?a?$/i];
function bukanWM(l){l=l.trim();return l&&!WM_BARIS.some(r=>r.test(l))}
function bersihWM(t){return String(t||'').split('\n').filter(bukanWM).join('\n').replace(/\n{3,}/g,'\n\n').trim()}
/* teks satu halaman pdf.js: buang item miring (watermark diagonal) & ukuran huruf ekstrem, susun ulang per baris */
function teksHalaman(items){
  const it=items.filter(i=>i.str&&i.str.trim()).map(i=>{const[a,b,c,d,x,y]=i.transform;return{s:i.str,x,y,w:i.width||0,h:Math.hypot(c,d)||i.height||0,miring:Math.abs(b)>0.01*Math.abs(a)+1e-6||Math.abs(c)>0.01*Math.abs(d)+1e-6}});
  const hs=it.filter(i=>!i.miring).map(i=>i.h).sort((p,q)=>p-q),med=hs.length?hs[hs.length>>1]:10;
  const ok=it.filter(i=>!i.miring&&i.h<med*2.6&&i.h>med*0.55).sort((p,q)=>Math.abs(q.y-p.y)>med*0.4?q.y-p.y:p.x-q.x);
  const bar=[];let cur=null;
  for(const i of ok){if(!cur||Math.abs(i.y-cur.y)>med*0.4){cur={y:i.y,t:i.s,ex:i.x+i.w};bar.push(cur)}
    else{cur.t+=(i.x-cur.ex>med*0.15&&!/\s$/.test(cur.t)&&!/^\s/.test(i.s)?' ':'')+i.s;cur.ex=i.x+i.w}}
  return bar.map(b=>b.t.replace(/\s+/g,' ').trim()).filter(bukanWM).join('\n')}
/* gambar → kanvas abu-abu; piksel terang (watermark samar/berwarna muda, latar kusam) diputihkan supaya OCR fokus ke tinta */

    const v=l>ambang||(m>60&&l>120)?255:Math.max(0,Math.round((l-40)*1.25));p[i]=p[i+1]=p[i+2]=v}g.putImageData(im,0,0);return cv}

const WM_ATURAN=`

/* heuristik teks penetapan PN (format direktori putusan MA) */
function parsePenetapan(raw){

    .replace(/Hal(?:aman)?\.?\s*\d+\s*dari\s*\d+\s*Halaman[^;]*?PN\s*\w+/gi,' ')
    .replace(/\b(\d{1,2})\s*[–—\-\/.]\s*(\d{1,2})\s*[–—\-\/.]\s*(\d{4})\b/g,(m,d,b,y)=>+b>=1&&+b<=12?`${d.padStart(2,'0')} ${BLN[b-1]} ${y}`:m)
    .replace(/\s+/g,' ');

  const NM="([A-Z][A-Z.' ]{2,}?)";
  const cleanName=n=>(n||'').replace(/^[^A-Za-z]+/,'').replace(/^(Sdr\.?|Sdri\.?|Tn\.?|Ny\.?|Nn\.?)\s*/i,'').replace(/[;:,.\s-]+$/,'').trim();

  R.nomorPenetapan=m1(/Nomor[\s:.\-]*(\d+\s*\/\s*Pdt\.?\s*P\s*\/\s*\d{4}\s*\/\s*P[NA]\s*[A-Za-z.]+)/i).replace(/\s*\/\s*/g,'/').replace(/Pdt\.?\s*P/i,'Pdt.P');
  R.pengadilan=m1(/(Pengadilan (?:Negeri|Agama) [A-Z][a-zA-Z]+(?: [A-Z][a-zA-Z]+)?)/).replace(/\s+(Yang|Kelas|Tersebut|Telah|Nomor)$/,'');
  const ai=flat.search(/MENETAPKAN|MENGADILI/);const amar=ai>=0?flat.slice(ai):flat;
  R.jenis=/pengampu/i.test(amar)||(!/\bwali\b/i.test(amar)&&/pengampu/i.test(flat))?'Pengampuan':'Perwalian';

/* penetapan diunggah ke berkas yang SUDAH ADA: hanya mengisi kolom yang kosong, anak baru ditambahkan tanpa menghapus anak lama.

   Islam / jenis kelamin awal, sudah dicentang sebagai saran tetapi tetap menunggu persetujuan). */
const kosong=v=>v===undefined||v===null||String(v).trim()==='';
const ISIAN_PEN=['jenis','pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','alamat','kelurahan','status','pasangan','aktaNikah','tglMeninggalPasangan','ketMeninggal','alasan','terkaitMiliter','orangTuaHidup','isiBap','saksiKet',...Object.values(JENIS_HARTA)];
function gabungKeBerkas(P,r){const t=penKeRec(P,{}),B=blank(),beda=[];
  const isi=(o,k,v,path,bawaan,ganti)=>{const lama=o[k],bwn=bawaan!==undefined&&String(lama)===String(bawaan);if(kosong(v)||String(lama??'')===String(v))return false;
    if(kosong(lama)||(ganti&&bwn)){o[k]=v;return true}beda.push({path,lama,baru:v,saran:bwn});return false};
  ISIAN_PEN.forEach(k=>{if(isi(r,k,t[k],k,B[k],k==='pengadilan')&&k==='kelurahan')r._kelManual=true});
  const pt=P.terampu||{};if(t.terampu&&t.terampu.nama){if(!objPolos(r.terampu))r.terampu={...B.terampu};const baru=kosong(r.terampu.nama);
    ['nama','jk','tglLahir','kondisi'].forEach(k=>{if(k!=='jk'||!kosong(pt.jk))isi(r.terampu,k,t.terampu[k],'terampu.'+k,B.terampu[k],baru)})}
  const nm=x=>String(x||'').toUpperCase().replace(/[^A-Z]/g,''),mentah=a=>(P.anak||[]).find(x=>x&&nm(x.nama)===nm(a.nama))||{};
  if(t.jenis==='Perwalian'&&Array.isArray(t.anak)){if(!Array.isArray(r.anak))r.anak=[];
    t.anak.forEach(a=>{let i=r.anak.findIndex(x=>x&&nm(x.nama)===nm(a.nama));
      if(i<0){i=r.anak.findIndex(x=>!x||kosong(x.nama));if(i<0)r.anak.push({...a});else r.anak[i]={...(r.anak[i]||{}),...a};return}
      const x=r.anak[i];isi(x,'tglLahir',a.tglLahir,`anak.${i}.tglLahir`);if(!kosong(mentah(a).jk))isi(x,'jk',a.jk,`anak.${i}.jk`,B.anak[0].jk)})}

function pakaiBeda(){if(!BEDA)return;const{r,L}=BEDA,pilih=[...document.querySelectorAll('[data-beda]:checked')].map(e=>L[+e.dataset.beda]);BEDA=null;dlgClose();if(!pilih.length)return;

const kunciW=t=>String(t||'').toLowerCase().replace(/\b(sei|sui)\b/g,'sungai').replace(/\btj\.?\s*/g,'tanjung ').replace(/\bbatu basar\b/,'batu besar').replace(/\bsungai beduk\b/,'sei beduk').replace(/[^a-z]/g,'');
const cariKantor=(m,nama)=>{const k=kunciW(nama);return Object.keys(m||{}).find(x=>kunciW(x)===k)};
function kotaKantor(r){const kk=kotaKab(r.kelurahan)||kotaKab(r.alamat);if(kk)return KANTOR[(kk.jenis+' '+kk.nama).toLowerCase().replace(/\s+/g,' ')];
  const pn=kunciW(r.pengadilan);return Object.values(KANTOR).find(K=>pn.includes(kunciW(K.kota.replace(/^(Kota|Kabupaten)\s+/,''))))}
function bersihIsianKantor(t){return String(t||'').replace(/Titik\s*Lokasi\s*(Maps|Google\s*Maps)?\s*:?\s*[23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{2,3}/gi,'').replace(/\b[23456789CFGHJMPQRVWX]{4,8}\+[23456789CFGHJMPQRVWX]{2,3}\b/g,'')
  .replace(/Kode\s*Pos\s*:?\s*/gi,'').replace(/\s{2,}/g,' ').replace(/\s+([,.])/g,'$1').trim()}
function isianBentrok(isi,kel,kec){const a=kunciW(isi),f=re=>{const m=isi.match(re);return m?kunciW(m[1]):''};
  const ik=f(/\b(?:Kec\.?|Kecamatan)\s*([A-Za-z .]+?)(?=[,;]|\s+(?:Kota|Kab|Kel|Prov|Kepulauan)|$)/i),il=f(/\b(?:Kel\.?|Kelurahan)\s*([A-Za-z .]+?)(?=[,;]|\s+(?:Kota|Kab|Kec|Prov|Kepulauan)|$)/i);
  return !!(kec&&ik&&ik!==kunciW(kec))||!!(kel&&il&&il!==kunciW(kel)&&!a.includes(kunciW(kel)))}
/* Email resmi kantor (diisi dari sumber resmi; kunci 'camat:<Kecamatan>' / 'lurah:<Kelurahan>') */
const EMAIL_KANTOR={ /* sumber: situs resmi kecamatan/kelurahan (batam.go.id) dan Direktori Pemko Batam, dicek Okt 2026 */
  'camat:Batam Kota':'bakot2017@gmail.com','camat:Batu Ampar':'batuampar458267@gmail.com','camat:Belakang Padang':'kec.belakangpadang@gmail.com','camat:Bengkong':'kecamatanbengkong@gmail.com',

  'lurah:Taman Baloi':'kelurahan_tamanbaloi@yahoo.com','lurah:Teluk Tering':'kelteluktering@batam.go.id','lurah:Batu Merah':'batumerah003@gmail.com'};
const emailKantor=(camat,nama)=>{const pre=camat?'camat:':'lurah:',k=Object.keys(EMAIL_KANTOR).find(x=>x.startsWith(pre)&&kunciW(x.slice(pre.length))===kunciW(nama));return k?EMAIL_KANTOR[k]:''};
const emailValid=e=>/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(e||'').trim());
/* tautan tulis email di Gmail (lampiran DOCX/PDF ditambahkan sendiri) */
function gmailUrl(ke,subjek,isi){return'https://mail.google.com/mail/?view=cm&fs=1&to='+encodeURIComponent(ke)+'&su='+encodeURIComponent(subjek)+'&body='+encodeURIComponent(isi)}
function emailSurat(r,keKantor){const t=tujuanSurat(r),d=derive(r),J=d.J,ke=keKantor?(t&&t.email):r.email;if(!emailValid(ke))return'';
  const subjek=`Surat Antar Pengambilan Sumpah ${J} — ${r.nama||''} (${r.nomorPenetapan||''})`;
  const isi=keKantor?`Yth. ${t.jab}\n\nDengan hormat,\nBersama email ini kami sampaikan Surat Antar dari Balai Harta Peninggalan Medan terkait pengambilan sumpah ${J} atas nama ${r.nama||''} (Penetapan ${r.nomorPenetapan||''}), warga di wilayah Bapak/Ibu. Surat terlampir.\n\nAtas perhatian dan kerja samanya kami ucapkan terima kasih.\n\nBalai Harta Peninggalan Medan\nWhatsApp Layanan Perwalian Pengampuan: 0851-2156-2136`
    :`Yth. ${d.sapa||'Bapak/Ibu'} ${r.nama||''}\n\nDengan hormat,\nBersama email ini kami sampaikan Surat Antar dari Balai Harta Peninggalan Medan terkait pengambilan sumpah ${J} (Penetapan ${r.nomorPenetapan||''}). Surat terlampir. Untuk memilih hari dan jam pelaksanaan, silakan hubungi WhatsApp Layanan Perwalian Pengampuan di 0851-2156-2136.\n\nHormat kami,\nBalai Harta Peninggalan Medan`;
  return gmailUrl(ke,subjek,isi)}
/* tujuan Surat Antar ke Lurah: isian petugas → kantor lurah (data) → kantor camat (bila kantor lurah tidak diketahui / hanya tahu kecamatan) */
function tujuanSurat(r){r=kelBaku(r);const w=wilayahLurah(r),K=kotaKantor(r),bersih=x=>String(x||'').replace(/^(Kelurahan|Desa|Kecamatan)\s+/i,'').trim();
  let isi=rapiAlamat(bersihIsianKantor(r.alamatKelurahan));const desa=/^Desa\b/i.test(w.kel);let kel=bersih(w.kel);
  /* "Kelurahan Sagulung" = nama kecamatan (di Batam tidak ada kelurahan yang namanya sama dengan kecamatan) → kirim ke Camat */
  let kecN=bersih(w.kec);if(K&&kel&&!cariKantor(K.lurah,kel)&&cariKantor(K.camat,kel)){if(!kecN)kecN=kel;kel=''}
  const kL=K&&kel&&cariKantor(K.lurah,kel),L=kL&&K.lurah[kL];
  const kec=(L&&L[2])||kecN;
  /* isian kantor yang menyebut kelurahan/kecamatan lain (salah salin dari Maps) diabaikan */
  if(isi&&isKepri(r)&&isianBentrok(isi,kel,kec))isi='';
  const kC=K&&kec&&cariKantor(K.camat,kec),C=kC&&K.camat[kC],kota=(K&&K.kota)||w.kota||'';
  const di=(nama,a,pos,kc)=>`${esc(nama)}<br>${esc(a)}${kc?', Kecamatan '+esc(kc):''}${kota?'<br>'+esc(kota)+(pos?' '+esc(pos):''):''}`;
  const lurah=x=>({email:emailKantor(false,kL||kel),camat:false,desa,pj:desa?'Kepala Desa':'Lurah',kt:desa?'Desa':'Kelurahan',jab:L?`Lurah ${kL}, Kecamatan ${kC||kec}${kota?', '+kota:''}`:r.kelurahan?lurahNm(r).replace(/<[^>]+>/g,''):`${desa?'Kepala Desa':'Lurah'} ${kel}${kec?', Kecamatan '+kec:''}${kota?', '+kota:''}`,...x});
  const camat=x=>({email:emailKantor(true,kC||kec),camat:true,pj:'Camat',kt:'Kecamatan',jab:`Camat ${kC||kec}${kota?', '+kota:''}`,...x});
  if(isi)return /^(Kantor\s+)?(Camat|Kecamatan)\b/i.test(isi)&&kec?camat({di:esc(isi),sumber:'isian'}):(kel||!kec)?lurah({di:esc(isi),sumber:'isian'}):camat({di:esc(isi),sumber:'isian'});
  if(L)return lurah({di:di(`Kantor ${desa?'Kepala Desa':'Lurah'} ${kL}`,L[0],L[1],kC||kec),sumber:'data'});
  /* kantor lurah tidak ada di data: dialihkan ke Camat bila kantor camatnya diketahui (mis. Batam); kota tanpa data kantor (mis. Pematangsiantar) tetap ke Lurah "di Tempat" */
  if(kec&&(C||!kel))return camat({di:C?di('Kantor Camat '+kC,C[0],C[1]):'Tempat',sumber:C?'data':''});
  if(kel)return lurah({di:'Tempat',sumber:''});
  return null}
/* ===== Kantor lurah: link Google Maps dari ketikan (gratis, tanpa AI) ===== */
function wilayahLurah(r){const t=[r.kelurahan,r.alamat].filter(Boolean).join(', ');const m=re=>((t.match(re)||[])[0]||'').trim();
  return{kel:m(/\b(?:Kelurahan|Kel\.|Desa)\s*[^,;]+/i).replace(/^Kel\.\s*/i,'Kelurahan '),kec:m(/\b(?:Kecamatan|Kec\.)\s*[^,;]+/i).replace(/^Kec\.\s*/i,'Kecamatan '),kota:(kk=>kk?kk.jenis+' '+kk.nama:'')(kotaKab(r.kelurahan)||kotaKab(r.alamat))}}
/* nama kantor baku dari kolom kelurahan: Kelurahan X → Kantor Lurah X; Desa X → Kantor Kepala Desa X */
function namaKantorLurah(r){const w=wilayahLurah(r);if(!w.kel)return'';const n=w.kel.replace(/^(Kelurahan|Desa)\s+/i,'').trim();return(/^Desa/i.test(w.kel)?'Kantor Kepala Desa ':'Kantor Lurah ')+n}
function petaLurahUrl(r){const w=wilayahLurah(r),ketik=String(r.alamatKelurahan||'').trim();
  const q=ketik?[ketik,!new RegExp(w.kec.replace(/^Kecamatan\s+/i,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(ketik)?w.kec:'',!/\b(Kota|Kabupaten|Kab\.)\b/i.test(ketik)?w.kota:''].filter(Boolean).join(', '):[namaKantorLurah(r),w.kec,w.kota].filter(Boolean).join(', ');
  return q?'https://www.google.com/maps/search/'+encodeURIComponent(q):''}
function lurahBoxHtml(){if(!cur)return'';const tj=tujuanSurat(cur),uK=emailSurat(cur,true),uW=emailSurat(cur,false);return(tj?`<div class="row" style="margin-bottom:6px">📮 Surat dikirim ke: <b>${esc(tj.jab)}</b> — <span>${tj.di.replace(/<br>/g,', ')}</span>${tj.email?` · ✉️ <b>${esc(tj.email)}</b>`:''}${uK?` <a class="btn" href="${esc(uK)}" target="_blank" rel="noopener">✉️ Tulis email ke kantor</a>`:''}${uW?` <a class="btn" href="${esc(uW)}" target="_blank" rel="noopener">✉️ Tulis email ke ${esc(derive(cur).J)}</a>`:''}${uK||uW?' <span class="hint">(lampirkan DOCX/PDF suratnya di Gmail)</span>':''}${tj.sumber==='data'?' <span class="hint">(alamat otomatis dari data kantor; ketik di kolom atas bila ingin mengganti)</span>':''}</div>`:'')+lurahBoxLama()}
function lurahBoxLama(){const u=petaLurahUrl(cur),nk=namaKantorLurah(cur),isi=String(cur.alamatKelurahan||'').trim();
  if(!u)return'<span class="hint">Isi kolom Kelurahan, Kecamatan, Kota di atas agar link Google Maps muncul.</span>';
  return`<div class="row"><a class="btn" href="${esc(u)}" target="_blank" rel="noopener">📍 Cari ${esc(isi?'ketikan ini':nk||'kantor lurah')} di Google Maps ↗</a>${!isi&&nk?`<button class="btn" type="button" onclick="tulisNamaKantor()">✍️ Tulis “${esc(nk)}”</button>`:''}<span class="hint">Salin alamat dari Google Maps, tulis nama kantornya dulu lalu alamatnya.</span></div>`}
function segarkanLurahBox(){const b=$('#lurahBox');if(b)b.innerHTML=lurahBoxHtml()}
function tulisNamaKantor(){const nk=namaKantorLurah(cur);if(!nk)return;cur.alamatKelurahan=nk+', ';save();const i=document.querySelector('[data-f="alamatKelurahan"] input');if(i){i.value=cur.alamatKelurahan;i.focus();i.setSelectionRange(i.value.length,i.value.length)}segarkanLurahBox()}
/* link ikut berubah saat mengetik di kolom kantor lurah atau kolom kelurahan */
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('[data-f="alamatKelurahan"],[data-kel]'))segarkanLurahBox()});
</script>
