<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dokumen Penyumpahan BHP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="if(matchMedia('(min-width:901px)').matches)this.media='all'">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#1c1f2e;--mut:#6b7087;--line:#e3e5ef;--pri:#4f46e5;--pri2:#eef0ff;--ok:#0f9d6b;--warn:#c2410c;--rad:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0;display:flex;gap:8px;align-items:center}
header h1 span{background:var(--pri);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--pri)}
.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px;max-width:1500px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.item{padding:10px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.item.on{border-color:var(--pri);background:var(--pri2)}
.pchips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.pchip{padding:3px 9px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);background:#fff;cursor:pointer}.pchip.on{background:#1c2340;color:#fff;border-color:transparent}.pchip.on small{color:#fff}.pgrp{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 2px 2px;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}.item b{display:block;font-size:13px}.item small{color:var(--mut)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
input,select,textarea{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
label{font-size:12px;color:var(--mut);font-weight:600;display:block;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.full{grid-column:1/-1}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps button{border-radius:99px;font-size:13px}
.steps button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
h3{margin:4px 0 12px;font-size:15px}
.hint{font-size:12px;color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:var(--pri);color:#fff}
.child{border:1px dashed var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.doc b{font-size:13px}.doc div{display:flex;gap:6px}
.doc button{flex:1;padding:6px;font-size:12px}
#prev{background:#8a8fa3;padding:20px;border-radius:var(--rad);overflow:auto;max-height:80vh}
.paper{background:#fff;color:#000;width:210mm;min-height:297mm;margin:0 auto 20px;padding:1cm 2cm 2.5cm 3cm;font:12pt/1.5 Arial,"Liberation Sans",Helvetica,sans-serif;box-shadow:0 4px 20px #0003}
.paper p{margin:0;text-align:justify;text-indent:36pt}.paper p[data-line]{border-bottom:1px dotted #000;min-height:24pt;line-height:24pt;margin-right:0}
.paper p.ni,.paper p.ctr{text-indent:0}.paper p.ctr,.paper .ctr{text-align:center}
table.kop{width:100%;border-collapse:collapse;border-bottom:1.25pt solid #000;margin:0 0 12pt}
.paper table.hd td:first-child{padding-left:0}.paper table.hd td:last-child{padding-right:0}
table.kop td{padding:0 0 3pt;vertical-align:middle}
table.kop td.lg{width:62pt;padding:0}
table.kop td.lg img{width:58pt;height:65pt;display:block}
table.kop td.tx{text-align:center;line-height:1.15;font-size:12pt}
table.kop .b{font-weight:bold}table.kop .s{font-size:10pt}
.paper table{border-collapse:collapse}.paper td{vertical-align:top;padding:1pt 4pt}
.ctr{text-align:center}.ttd{width:100%;margin-top:20pt}.ttd td{width:50%;text-align:left}.ttd.ctr td{text-align:center}.paper ul.dash{list-style:none;padding-left:18pt}.paper ul.dash li::before{content:'-';display:inline-block;width:18pt;margin-left:-18pt}
.paper ol{margin:0 0 8pt;padding-left:18pt}.paper ol li{padding-left:0}.paper p[data-n]{padding-left:18pt;text-indent:-18pt}.paper p[data-n]::before{content:attr(data-n);display:inline-block;width:18pt;text-indent:0}.paper p[data-b]::before{font-weight:bold}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media print{@page{size:A4;margin:0}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0}.paper{box-shadow:none;margin:0;page-break-after:always}}
body.locked header,body.locked .wrap{display:none}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:0 16px}
.log{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.logi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ld{margin-top:4px;font-size:13px}.dif{margin:0;padding-left:18px}
del{color:#b91c1c;text-decoration:line-through}ins{color:#047857;text-decoration:none;font-weight:600}
.meta{font-size:12px;color:var(--mut)}
.nomor{font-size:12px;padding:6px 8px;border-radius:8px;background:var(--pri2)}
.kurang{font-size:11px;color:var(--warn)}
/* ===== tema e-Office BHP Medan ===== */
:root{--navy:#1b2345;--navy2:#252f5c;--gold:#f6c343;--gold2:#fff6db;--pri:#1b2345;--pri2:#eef1f9;--bg:#f3f4f8;--line:#e4e7ef;--rad:16px}
body{padding-left:250px}
.side{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#cfd5ea;display:flex;flex-direction:column;z-index:10;overflow:auto}
.side .brand{display:flex;gap:10px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid #ffffff14}
.side .brand img{width:38px;height:42px;object-fit:contain}.side .brand b{display:block;color:#fff;font-size:16px;letter-spacing:.3px}.side .brand small{font-size:11.5px;opacity:.75}
.side .sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;opacity:.55;padding:18px 20px 6px}
.side .nav{display:flex;gap:10px;align-items:center;margin:2px 12px;padding:11px 14px;border-radius:12px;color:#e8ebf7;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px}
.side .nav:hover{background:#ffffff12}.side .nav.on{background:var(--gold);color:var(--navy);box-shadow:0 6px 18px #f6c34355}
.side .foot{margin-top:auto;padding:16px 20px;font-size:11px;opacity:.6;border-top:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}
.side .foot button{background:none;border:0;color:inherit;padding:0;font-size:14px}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;gap:14px;align-items:center}
.top h2{margin:0;font-size:20px}.top small{color:var(--mut)}.top .grow{margin-right:auto}
.top #q{width:220px;border-radius:99px;padding:9px 16px}
#who{display:flex;gap:10px;align-items:center}
.uname{text-align:right;line-height:1.2}.uname b{display:block;font-size:13px;text-transform:uppercase}.uname small{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}
.menubtn{background:var(--navy)!important;color:#fff!important;border:0!important;border-radius:99px!important;padding:9px 16px!important}
.pri,button.pri,label.pri{background:var(--gold)!important;color:var(--navy)!important;border-color:var(--gold)!important;font-weight:700}
.pri:hover{filter:brightness(.97);box-shadow:0 6px 16px #f6c34366}
.steps button.on{background:var(--navy);border-color:var(--navy)}
.seg button.on{background:var(--navy)}
.item.on{border-color:var(--navy);background:var(--pri2)}
.tag{background:var(--gold2);color:#8a6200}
.wrap{padding:22px 26px;max-width:1500px;margin:0}
.card{border-radius:var(--rad);box-shadow:0 1px 3px #1b234510}
/* wizard */
.wz{max-width:880px;margin:0 auto;padding:30px 34px}
.wz-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:22px}
.wz-h h2{margin:0 0 4px;font-size:22px}.wz-h p{margin:0;color:var(--mut)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--pri2);color:var(--mut);font-size:14px}
.stepper i.on{background:var(--navy);color:#fff}.stepper i.done{background:var(--gold);color:var(--navy)}
.stepper s{width:22px;height:2px;background:var(--line);text-decoration:none}
.wz h4{font-size:15px;margin:0 0 14px;display:flex;gap:8px;align-items:center}
.wz .lbl{font-weight:700;font-size:13px;margin:18px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;position:relative;transition:.15s}
.opt:hover{border-color:#c5cbe0}.opt.on{border-color:var(--navy);background:var(--pri2)}
.opt b{display:block;margin-bottom:4px}.opt span{font-size:12.5px;color:var(--mut)}
.opt:after{content:"";position:absolute;right:16px;top:16px;width:16px;height:16px;border-radius:50%;border:2px solid #b8bfd4}
.opt.on:after{border:5px solid var(--navy)}
.drop{margin-top:6px;border:2px dashed #c5cbe0;border-radius:16px;padding:38px 20px;text-align:center;cursor:pointer;background:var(--bg);transition:.15s;display:block}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--pri2)}
.drop .ic{font-size:40px}.drop b{display:block;font-size:16px;margin:8px 0 4px}.drop small{color:var(--mut)}
.wz-f{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.wz-f .pri{padding:11px 20px;border-radius:12px}
.link{background:none!important;border:0!important;color:var(--mut)!important;text-decoration:underline;padding:0!important}
.spin{width:38px;height:38px;border:4px solid var(--pri2);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.dash .card b{font-size:26px;display:block}.dash .card span{color:var(--mut);font-size:12.5px}
#login{background:radial-gradient(circle at 20% 10%,#2c3972,var(--navy) 70%)}
#login form{border:0;box-shadow:0 30px 60px #0005}
@media(max-width:900px){body{padding-left:0}.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.side .sec,.side .foot{display:none}.side .brand{border:0;padding:12px}.side .nav{margin:4px;padding:8px 10px;font-size:13px}.top{flex-wrap:wrap;padding:12px 16px}.top #q{width:100%}.wrap{padding:14px}.opts,.dash{grid-template-columns:1fr}.wz{padding:20px}}
[hidden]{display:none!important}
/* pengecekan */
.bad input,.bad select,.bad textarea{border-color:#e5484d!important;background:#fff5f5!important}
.bad label:after{content:" ⚠";color:#e5484d}
.warnf input,.warnf select,.warnf textarea{border-color:#f5a524!important;background:#fffaf0!important}
.warnf label:after{content:" ⚠";color:#d98a00}
.fmsg{display:block;font-size:11.5px;margin-top:3px;color:#c2272d}.warnf .fmsg{color:#a86a00}
.steps button{position:relative}.steps .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;font-size:10.5px;line-height:18px;padding:0 5px;color:#fff;background:#e5484d;font-weight:700}
.steps .dot.w{background:#f5a524}
.cekbar{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;cursor:pointer}
.cekbar.e{background:#fdecec;color:#9b1c1f;border:1px solid #f3b4b4}.cekbar.w{background:#fff6e0;color:#7a5200;border:1px solid #f2d38a}.cekbar.ok{background:#e9f8f1;color:#0b6b48;border:1px solid #b5e5cf;cursor:default}
.ceklist{margin:0;padding:0;list-style:none}.ceklist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.ceklist .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;color:#fff}.ceklist .ic.e{background:#e5484d}.ceklist .ic.w{background:#f5a524}
.ceklist a{margin-left:auto;font-size:12px;color:var(--navy);cursor:pointer;white-space:nowrap;text-decoration:underline}
/* paket berkas */
.paket{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:linear-gradient(180deg,var(--pri2),var(--card) 60%)}
.paket-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.paket-h>div:first-child{margin-right:auto}
.prog{width:140px;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--gold)}
.paket-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.paket-c h5{margin:0 0 8px;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.pk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-weight:400}
.pk:hover{border-color:var(--navy)}.pk input{width:auto;margin-top:3px}.pk b{display:block;font-size:13.5px}.pk small{color:var(--mut);font-size:11.5px}
.pk.ok{border-color:#b5e5cf;background:#f1fbf6}
@media(max-width:900px){.paket-g{grid-template-columns:1fr}}
/* kalender */
.cal{user-select:none}.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cal-h b{font-size:17px;margin-right:auto}
.cal-h button{border-radius:10px;padding:7px 12px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-g .hd{font-size:11px;font-weight:700;color:var(--mut);text-align:center;letter-spacing:.5px;padding:4px 0}
.cal-g .d{border:1px solid var(--line);border-radius:12px;min-height:78px;padding:8px;cursor:pointer;position:relative;background:var(--card);transition:.12s}
.cal-g .d:hover{border-color:var(--navy);box-shadow:0 4px 14px #1b234514}
.cal-g .d.x{opacity:.35}.cal-g .d.we{background:var(--bg)}.cal-g .d.td{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal-g .d.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal-g .n{font-weight:700;font-size:13px}
.cal-g .d.lb .n{color:#dc2626}.cal-g .d.lb{background:#fff5f5}.cal-g .lbn{display:block;font-size:10.5px;color:#dc2626;margin-top:3px;line-height:1.25}
.cal-g .kg{display:block;font-size:10.5px;border-radius:6px;padding:2px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.cal.mini .cal-g .lbn,.cal.mini .cal-g .kg{display:none}.cal.mini .cal-g .d.lb:after{content:"";position:absolute;left:6px;bottom:5px;width:5px;height:5px;border-radius:50%;background:#dc2626}
.kgdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cal-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:10px}
.cal-g .c{position:absolute;right:8px;top:8px;background:var(--gold);color:var(--navy);font-weight:800;font-size:11.5px;border-radius:99px;padding:1px 8px}
.cal-g .nm{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.cal-g .d.sel .nm{color:#dfe3f3}
.cal.mini .cal-g{gap:4px}.cal.mini .cal-g .d{min-height:40px;padding:5px 6px;border-radius:9px}.cal.mini .cal-g .n{font-size:12px}
.cal.mini .cal-g .c{right:4px;top:4px;font-size:10px;padding:0 6px}.cal.mini .cal-h b{font-size:14px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.cal-wrap>*{min-width:0}.cal-g .d{min-width:0;overflow:hidden}
.cal-side h4{margin:0 0 10px}.cal-side .ev{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.cal-side .ev:hover{border-color:var(--navy)}.cal-side .ev small{color:var(--mut)}
.cal-stat{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.cal-stat div{background:var(--bg);border-radius:12px;padding:8px 14px}.cal-stat b{font-size:18px;margin-right:6px}
@media(max-width:900px){.cal-wrap{grid-template-columns:1fr}.cal-g .nm{display:none}.cal-g .d{min-height:52px}}
html,body{max-width:100%;overflow-x:hidden}
#login{display:flex;align-items:center;justify-content:center;padding:16px}
#login form{width:100%;max-width:380px;margin:0!important}
@media(max-width:900px){.top .uname{display:none}.top{gap:8px}.side{gap:0}.card{min-width:0}.wrap>*{min-width:0}#prev{padding:8px}.paper{transform-origin:top left}.wz{padding:16px 6px}.wz-h{flex-direction:column}.wz-h h2{font-size:19px}.top h2{font-size:17px}.side .brand small{display:none}}
.wrap.wzmode{grid-template-columns:1fr}.wrap.wzmode>aside{display:none}
.docs button.pri{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
.nav i{font-style:normal}.more-m,.back-m{display:none!important}

  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}

    flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;justify-content:space-around;gap:2px!important;

  body.menu-m .side .nav:not([hidden]),body.menu-m .side .brand{display:flex!important;flex:none;flex-direction:row;gap:12px;font-size:15px!important;padding:13px 14px!important;justify-content:flex-start;text-align:left}

  body.menu-m .side .foot{display:flex!important}
  body.menu-m .side .nav i{font-size:17px;width:22px;text-align:center}
  body.menu-m .side .nav:not([hidden]){margin:1px 0!important;min-height:0}

/* ---------------- util tanggal & terbilang ---------------- */
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function today(){const d=new Date(Date.now()+7*3600e3);return d.toISOString().slice(0,10)}
function pd(s){if(!s)return null;const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function tgl(s){const d=pd(s);return d?`${String(d.getDate()).padStart(2,'0')} ${BLN[d.getMonth()]} ${d.getFullYear()}`:'…'}
function hari(s){const d=pd(s);return d?HARI[d.getDay()]:'…'}
function usia(s,ref){const d=pd(s);if(!d)return'…';const r=pd(ref)||new Date();let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u+' Tahun'}
function umurTh(s,ref){const d=pd(s);if(!d)return null;const r=pd(ref)||new Date();let u=r.getFullYear()-d.getFullYear();if(r<new Date(r.getFullYear(),d.getMonth(),d.getDate()))u--;return u}
/* ---- filter kelayakan perwalian ---- */
const BATAS_DEWASA=17;
const MILITER=/\b(TNI|ABRI|tentara|prajurit|militer|angkatan\s+(darat|laut|udara)|kodim|korem|kodam|koramil|lanud|lantamal|yonif|kostrad|ASABRI|polri|kepolisian|polisi|bhayangkara|brimob|bintara|tamtama|perwira)\b/i;
function anakWali(r){if(r.jenis!=='Perwalian')return[];const ref=r.tglSumpah||today();
  const A=(r.anak||[]).filter(a=>a.nama&&a.wali!=='Tidak');
  const kecil=A.filter(a=>{const u=umurTh(a.tglLahir,ref);return u===null||u<BATAS_DEWASA});
  return kecil.length?kecil:A}
function cekKelayakan(r){const tolak=[],info=[];if(!r||r.jenis!=='Perwalian')return{tolak,info};
  const ref=r.tglSumpah||today(),A=(r.anak||[]).filter(a=>a&&a.nama&&a.wali!=='Tidak'&&a.diwalikan!==false);
  const um=A.map(a=>({a,u:umurTh(a.tglLahir,ref)})),besar=um.filter(x=>x.u!==null&&x.u>=BATAS_DEWASA);
  if(A.length&&besar.length===A.length)info.push(besar.every(x=>x.u>=18)?'Seluruh anak sudah DEWASA (18 tahun ke atas).':'Seluruh anak sudah HAMPIR DEWASA ('+BATAS_DEWASA+' tahun ke atas).');
  else if(besar.length)info.push('Anak yang sudah '+BATAS_DEWASA+' tahun ke atas tidak dimasukkan (hanya anak yang lebih kecil): '+besar.map(x=>x.a.nama+' ('+x.u+' th)').join(', ')+'.');
  const teks=[r.pekerjaan,r.alasan,r.ketMeninggal,r.terkaitMiliter,r.isiBap].join('.\n').replace(/[^.;\n]*(SKCK|catatan kepolisian|kepolisian (negara|resor|daerah|sektor)|polres|polda|polsek)[^.;\n]*/gi,' ');
  const m=teks.match(MILITER);if(m||r.terkaitMiliter)tolak.push('Terkait TNI/Polri/ASABRI'+(m?' (ditemukan kata "'+m[0]+'")':'')+(r.terkaitMiliter?': '+r.terkaitMiliter:'')+'. Alasan: permohonan perwalian yang berkaitan dengan anggota TNI/Polri atau hak ASABRI tidak dilayani penyumpahan/pengawasannya oleh Balai Harta Peninggalan Medan sesuai kebijakan layanan BHP Medan.');
  if(r.orangTuaHidup===true||r.orangTuaHidup==='Ya')tolak.push('Kedua orang tua anak masih hidup. Alasan: sesuai Pasal 47 ayat (1) dan (2) serta Pasal 50 ayat (1) UU No. 1 Tahun 1974 tentang Perkawinan, anak yang kedua orang tuanya masih hidup berada di bawah kekuasaan orang tua, bukan di bawah perwalian, sehingga tidak ada perwalian yang diawasi BHP selaku Wali Pengawas (Pasal 366 KUHPerdata).');

function terbilang(n){const s=['','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan','Sepuluh','Sebelas'];
  if(n<12)return s[n];if(n<20)return terbilang(n-10)+' Belas';if(n<100)return terbilang(Math.floor(n/10))+' Puluh '+terbilang(n%10);
  if(n<200)return'Seratus '+terbilang(n-100);if(n<1000)return terbilang(Math.floor(n/100))+' Ratus '+terbilang(n%100);

function tglBA(s){const d=pd(s);return d?`${HARI[d.getDay()]}, tanggal ${tb(d.getDate())} bulan ${BLN[d.getMonth()]} tahun ${tb(d.getFullYear())}`:'…'}
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const V=v=>v?esc(v):'<span style="background:#fde68a">……</span>';

/* pejabat penanda tangan BA Sumpah / BA Inventarisasi / BAP: Kurator Keperdataan minimal Ahli Muda (Muda, Madya, Utama) atau Kepala Seksi Harta Peninggalan */
const pjJab=p=>String(p&&p.jabatan||'').toLowerCase().replace(/\s+/g,' ');
const pjKurator=p=>/kurator/.test(pjJab(p))&&/ahli\s*(muda|madya|utama)/.test(pjJab(p));
const pjKasi=p=>/(kepala\s*seksi|kasi\b|kasubag|kepala\s*sub).*(harta\s*peninggalan|hp\b)|harta\s*peninggalan.*kepala\s*seksi/.test(pjJab(p))&&!/pelaksana|staf|staff/.test(pjJab(p));
const pjLayak=p=>!!p&&!!p.nama&&(pjKurator(p)||pjKasi(p));
function pjOptLayak(v){const P=SET.pejabat||[],c=pjCari(v).nama,ur=(a,b)=>String(a.nama).localeCompare(b.nama);
  const k=P.filter(pjKurator).sort(ur),h=P.filter(p=>pjKasi(p)&&!pjKurator(p)).sort(ur),lain=P.filter(p=>!pjLayak(p)&&p.nama===c);
  const o=p=>`<option ${p.nama===c?'selected':''} value="${esc(p.nama)}">${esc(p.nama||'(isi di Pengaturan)')} — ${esc(p.jabatan||'')}${p.nip?'':' (NIP kosong)'}</option>`;
  return (k.length?`<optgroup label="Kurator Keperdataan (Ahli Muda ke atas)">${k.map(o).join('')}</optgroup>`:'')+(h.length?`<optgroup label="Kepala Seksi Harta Peninggalan">${h.map(o).join('')}</optgroup>`:'')
    +(lain.length?`<optgroup label="⚠ Tidak memenuhi syarat jabatan">${lain.map(o).join('')}</optgroup>`:'')
    +((k.length+h.length+lain.length)?'':P.map(o).join(''))}
const pjPeringatan=v=>{const x=pjCari(v);return x.nama&&!pjLayak(x)&&(SET.pejabat||[]).some(pjLayak)?`<small class="fmsg">Jabatan "${esc(x.jabatan||'-')}" tidak memenuhi syarat (Kurator Keperdataan min. Ahli Muda / Kepala Seksi Harta Peninggalan)</small>`:''};
function pjCari(v){const P=SET.pejabat||[];if(typeof v==='number')return P[v]||{};return P.find(p=>p.nama===v)||{nama:v||'',nip:'',jabatan:''}}
function derive(r){
  const w=r.jenis==='Perwalian', J=w?'Wali':'Pengampu';
  const sapa=r.jk==='Laki-laki'?'Bapak':'Ibu';
  const anak=w?anakWali(r):[];
  const objek=w?anak.map(a=>a.nama).join(', '):r.terampu.nama;
  const statusRel=r.status||(w?'Anak':'Keluarga');
  const kel=r.kelurahan||'';
  let laf=(SET.lafaz[r.agama]||SET.lafaz.Islam).replace('{JENIS}',w?'Perwalian':'Pengampuan')
    .replace('{STATUS}',statusRel.toLowerCase()).replace('{PENGADILAN}',r.pengadilan);
  return{w,J,sapa,objek,statusRel,kel,laf,madya:pjCari(r.madya),muda:pjCari(r.muda),anak,
    pihak:w?'Anak':'Terampu',jenisTxt:w?'Perwalian':'Pengampuan'};

const PROMPT_BAP=`Anda penyusun Berita Acara Penghadapan (BAP) pada Balai Harta Peninggalan Medan. Baca SELURUH penetapan pengadilan terlampir (identitas, duduk perkara, bukti surat, keterangan saksi, pertimbangan hukum, amar) lalu susun isi BAP berupa keterangan penghadap (= pemohon yang ditetapkan sebagai wali/pengampu) yang LENGKAP, TAJAM, RUNTUT dan MENGALIR — setiap butir menyambung logis dengan butir sebelumnya.
Urutan butir (lewati yang datanya tidak ada di penetapan):
1. Identitas lengkap penghadap: nama, NIK, tempat & tanggal lahir, usia, agama, pekerjaan, alamat lengkap; serta hubungan penghadap dengan anak/terampu.
2. Perkawinan penghadap: dengan siapa (identitas pasangan), kapan & di mana menikah, dasar Kutipan Akta Nikah/Akta Perkawinan (nomor, tanggal, instansi).
3. Anak-anak dari perkawinan tersebut: pengantar lalu satu sub-butir per anak (nama, jenis kelamin, tempat & tanggal lahir, usia, nomor akta kelahiran bila ada), urut dari yang tertua.
4. Meninggalnya pasangan/orang tua: tanggal, tempat, sebab bila disebut, dasar Akta/Surat Kematian (nomor, tanggal, instansi); akibat hukumnya terhadap anak.
5. Anak yang masih di bawah umur (belum 18 tahun/belum kawin) dan berada di bawah perwalian penghadap: sub-butir per anak.
   (Untuk Pengampuan ganti butir 2–5 dengan: identitas terampu, hubungan dengan penghadap, riwayat & kondisi kesehatan terampu, dasar surat keterangan dokter/rumah sakit, akibatnya terhadap kecakapan hukum terampu.)
6. Latar belakang dan alasan konkret mengajukan permohonan (kepentingan hukum yang hendak dilakukan, mis. mengurus/menjual/membalik nama aset, mencairkan dana, keperluan pendidikan/nafkah anak).
7. Harta kekayaan anak/terampu: pengantar lalu sub-butir per aset (jenis, luas, lokasi, nomor sertifikat/rekening, atas nama, asal-usul, nilai bila disebut); bila perlu sub-sub-butir untuk rincian.
8. Keterangan para saksi di persidangan: pengantar lalu sub-butir per saksi (nama, hubungan dengan penghadap, pokok keterangan yang relevan).
9. Penetapan pengadilan: nama pengadilan, nomor, tanggal, dan pokok amar yang menetapkan penghadap sebagai wali/pengampu (sebut nama anak/terampu).
10. Kesanggupan penghadap menjalankan tugas dengan penuh tanggung jawab dan bersedia diawasi Balai Harta Peninggalan Medan selaku Wali/Pengampu Pengawas.
FORMAT WAJIB:
- Satu butir per baris. Butir utama TANPA nomor, diawali kata "Bahwa". Sub-butir diawali "- " (tanpa huruf), sub-sub-butir diawali "-- ". Penomoran dibuat otomatis oleh aplikasi — jangan menulis nomor/huruf sendiri.
- Akhiri setiap butir/sub-butir dengan ";" kecuali butir paling akhir diakhiri ".".
- Nama orang dalam HURUF KAPITAL dan diapit ** ** (contoh **SITI AMINAH**). Sebut pemohon sebagai "penghadap".
- Untuk USIA jangan hitung sendiri: tulis {usia:YYYY-MM-DD} berisi tanggal lahir orangnya. Untuk tanggal tulis {tgl:YYYY-MM-DD}.
- Bahasa Indonesia baku gaya berita acara resmi; kalimat padat, jelas, tidak berulang.
- HANYA fakta yang tertulis di penetapan. Jangan mengarang nomor, tanggal, nama, atau aset.
Balas satu objek JSON: {"isiBap":["baris 1","baris 2", "..."]}`;

async function prosesOtomatis(){if(!cur)return;clearTimeout(saveT);await flush();const P=(PILIH||pilihDefault(cur)).filter(g=>GRUP[g]);if(!P.length){toast('Centang minimal satu dokumen');return}

async function jalankanOtomatis(tglNo){const P=(PILIH||pilihDefault(cur)).filter(g=>GRUP[g]),tanpa=Object.entries(NOMOR).filter(([k,f])=>P.includes(k)&&!cur[f]);

  $('#gDlg').dataset.lock='';renderMain()}

  h+=`<div><label>Jenis</label><select data-pk="jenis">${['Pengampuan','Perwalian'].map(j=>`<option ${j===d.jenis?'selected':''}>${j}</option>`).join('')}</select></div>`;
  ['pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','status'].forEach(k=>h+=row(k,PEN_LBL[k],d[k],/^tgl/.test(k)?'date':'text'));
  h+=`<div class="full">${row('alamat','Alamat',d.alamat)}</div><div class="full">${row('kelurahan','Kelurahan, Kecamatan, Kota',d.kelurahan)}</div>`;
  if(w)(d.anak||[]).forEach((a,i)=>h+=row(`anak.${i}.nama`,`Anak ${i+1}`,a.nama)+row(`anak.${i}.tglLahir`,'Tgl lahir',a.tglLahir,'date')+row(`anak.${i}.jk`,'JK',a.jk));
  else{const t=d.terampu||{};h+=row('terampu.nama','Nama Terampu',t.nama)+row('terampu.tglLahir','Tgl Lahir Terampu',t.tglLahir,'date')+row('terampu.jk','JK Terampu',t.jk)+`<div class="full">${row('terampu.kondisi','Kondisi medis',t.kondisi)}</div>`}
  return h+`</div>${d._text?`<details style="margin-top:10px"><summary class="hint">Lihat teks hasil baca</summary><pre style="white-space:pre-wrap;max-height:200px;overflow:auto;font-size:11px">${esc(d._text)}</pre></details>`:''}`}
function reviewPenetapan(d,fname){$('#penBody').innerHTML=`<h3>📑 Hasil baca: ${esc(fname)} ${d._ai?'<span class="tag">AI</span>':''}</h3><p class="hint">Periksa & koreksi dulu. Kolom kuning = tidak ditemukan di dokumen.</p>`+bannerKelayakan(penRec(d))+reviewHtml(d)+
  (cekKelayakan(penRec(d)).tolak.length?`<p style="text-align:right;display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button onclick="screenshot('#penBody',PEN&&PEN.nama)">📸 Screenshot</button><button class="pri" onclick="penDlg.close()">Tutup (ditolak)</button><button onclick="PEN._paksa=true;applyPenetapan()" style="font-size:12px">Tetap simpan (abaikan penolakan)</button></p>`:
  `<p style="text-align:right;display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button onclick="screenshot('#penBody',PEN&&PEN.nama)">📸 Screenshot</button><button onclick="penDlg.close()">Batal</button><button class="pri" onclick="applyPenetapan()">✔ Terapkan ke berkas</button></p>`);if(!$('#penDlg').open)$('#penDlg').showModal()}
const penRec=d=>({...d,anak:(d.anak||[]).map(a=>({...a,wali:a.diwalikan===false||a.wali==='Tidak'?'Tidak':'Ya'}))});
const JENIS_HARTA={tetap:'hartaTetap',tunai:'hartaTunai',emas:'hartaEmas',surat:'hartaSurat',perabot:'hartaPerabot',bergerak:'hartaBergerak',hutang:'hartaHutang'};
function terapkanTambahan(P,r){
  if(Array.isArray(P.harta)){const add={};P.harta.forEach(h=>{const f=JENIS_HARTA[String(h&&h.jenis||'').toLowerCase()]||'hartaBergerak',u=String(h&&h.uraian||'').trim();if(u)(add[f]=add[f]||[]).push(u)});
    for(const f in add)if(!baris(r[f]).length)r[f]=add[f].join('\n')}
  if(Array.isArray(P.saksi)&&!baris(r.saksiKet).length){const l=P.saksi.filter(x=>x&&x.keterangan).map(x=>`saksi ${String(x.nama||'').toUpperCase()} menerangkan ${String(x.keterangan).replace(/^(bahwa|menerangkan)\s+/i,'').replace(/[.;]\s*$/,'')}`.replace('saksi  ','saksi '));if(l.length)r.saksiKet=l.join('\n')}}
function applyPenetapan(root,next){
  (root||$('#penBody')).querySelectorAll('[data-pk]').forEach(e=>{const ks=e.dataset.pk.split('.');let o=PEN;ks.slice(0,-1).forEach((k,i)=>{o[k]=o[k]??(/^\d+$/.test(ks[i+1])?[]:{});o=o[k]});o[ks.at(-1)]=e.value.trim()});
  {const k=cekKelayakan(penRec(PEN));if(k.tolak.length&&!PEN._paksa){toast('⛔ Penetapan ditolak otomatis: '+k.tolak.join(' '));api('apiCatat','TOLAK_PENETAPAN','',PEN.nama||'',(PEN.nomorPenetapan||'')+' — '+k.tolak.join(' ')).catch(()=>{});return}}
  let r=(penFill&&cur&&!cur._dihapus)?cur:null;const baru=!r;if(!r)r=addRec(blank(),'Dibuat dari upload penetapan '+(PEN.nomorPenetapan||''));
  ['jenis','pengadilan','nomorPenetapan','tglPenetapan','nama','nik','jk','tglLahir','agama','pekerjaan','alamat','kelurahan','status','pasangan','aktaNikah','tglMeninggalPasangan','ketMeninggal','alasan','terkaitMiliter'].forEach(k=>{if(PEN[k])r[k]=typeof PEN[k]==='string'?PEN[k]:String(PEN[k])});
  if(samar(r.nama))r.nama='';
  if(typeof PEN.orangTuaHidup==='boolean')r.orangTuaHidup=PEN.orangTuaHidup;terapkanTambahan(PEN,r);if(typeof PEN.isiBap==='string'&&PEN.isiBap.trim())r.isiBap=PEN.isiBap;
  if(PEN.kelurahan)r._kelManual=true;
  if(PEN.jenis==='Perwalian'){const a=(PEN.anak||[]).filter(x=>x&&(x.nama||x.tglLahir)).map(x=>({nama:samar(x.nama)?'':String(x.nama).toUpperCase(),jk:/perem/i.test(x.jk)?'Perempuan':'Laki-laki',tglLahir:x.tglLahir||'',wali:x.diwalikan===false||x.wali==='Tidak'?'Tidak':'Ya'}));if(a.length)r.anak=a}
  else if(PEN.terampu){const t=PEN.terampu;r.terampu={nama:samar(t.nama)?'':t.nama||'',jk:/perem/i.test(t.jk)?'Perempuan':'Laki-laki',tglLahir:t.tglLahir||'',kondisi:t.kondisi||''}}
  cur=r;tab='jadwal';if($('#penDlg').open)penDlg.close();renderList();if(next)next();else renderMain();Promise.resolve(flush()).then(()=>sippIsiKosong(r)).catch(()=>{});api('apiCatat','BACA_PENETAPAN',r.id,r.nama,'Isian diambil dari penetapan '+(PEN.nomorPenetapan||'')+(PEN._ai?' (AI)':'')).catch(()=>{});toast('Data penetapan diterapkan — lanjut isi jadwal sumpah')}


/* ---------------- wizard Berkas Baru (3 bagian) ---------------- */
const WZ={on:false,step:1,jenis:'Pengampuan',pilih:false};
const stepper=n=>`<div class="stepper">${[1,2,3].map(i=>`<i class="${i===n?'on':i<n?'done':''}">${i<n?'✓':i}</i>`).join('<s></s>')}</div>`;
const wzHead=n=>`<div class="wz-h"><div><h2>Berkas Penyumpahan Baru</h2><p>Lengkapi berkas dalam 3 tahap.</p></div>${stepper(n)}</div>`;
function wizard(step){WZ.on=true;$('.wrap').classList.add('wzmode');WZ.step=step;if(step===1){cur=null;renderList()}setNav('baru','Berkas Baru');const m=$('#main');
  if(step===1){m.innerHTML=`<div class="wz">${wzHead(1)}<h4>📂 Bagian 1: Jenis & Penetapan Pengadilan</h4>
    <div class="lbl">Pilih Jenis Penyumpahan</div><div class="opts">
    ${[['Pengampuan','Pengampu atas orang dewasa yang berada di bawah pengampuan (terampu).'],['Perwalian','Wali atas anak yang masih di bawah umur.']].map(([j,d])=>`<div class="opt ${WZ.jenis===j?'on':''}" onclick="WZ.jenis='${j}';WZ.pilih=true;wizard(1)"><b>${j}</b><span>${d}</span></div>`).join('')}</div>
    <div class="lbl">Upload Penetapan Pengadilan</div>
    <label class="drop" id="wzDrop" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="event.preventDefault();this.classList.remove('over');handlePenetapan(event.dataTransfer.files[0])">
      <div class="ic">📄</div><b>Klik atau seret file PDF penetapan ke sini</b><small>PDF asli atau hasil scan · data dibaca otomatis${ADA_AI?' dengan AI':''}</small>
      <input type="file" accept=".pdf,image/*" hidden onchange="uploadPenetapan(this)"></label>
    <div class="wz-f"><button class="link" onclick="WZ.on=false;newRec();cur.jenis=WZ.jenis;save();renderMain()">Isi manual tanpa penetapan</button><span class="hint">Setelah upload, lanjut ke Bagian 2 otomatis</span></div></div>`}
  if(step===2){const d=WZ.data;m.innerHTML=`<div class="wz">${wzHead(2)}<h4>🔎 Bagian 2: Periksa Data dari Penetapan ${d._ai?'<span class="tag">AI</span>':''}</h4>
    <p class="hint" style="margin-top:-6px">Kolom kuning belum ditemukan di dokumen — lengkapi bila perlu.</p>${boxCek(cekData(d))}${bannerKelayakan(penRec(d))}<div id="wzBody">${reviewHtml(d)}</div>
    <div class="wz-f"><button onclick="wizard(1)">← Kembali</button>${cekKelayakan(penRec(d)).tolak.length?`<button onclick="PEN._paksa=true;applyPenetapan($('#wzBody'),()=>wizard(3))" style="font-size:12px">Tetap lanjut (abaikan penolakan)</button><button class="pri" onclick="WZ.on=false;renderMain()">Tutup — penetapan ditolak</button>`:`<button class="pri" onclick="applyPenetapan($('#wzBody'),()=>wizard(3))">Lanjut ke Bagian 3 →</button>`}</div></div>`}
  if(step===3){const pjOpt=v=>{const c=pjCari(v).nama;return SET.pejabat.map(p=>`<option ${p.nama===c?'selected':''} value="${esc(p.nama)}">${esc(p.nama)} — ${esc(p.jabatan||'')}</option>`).join('')};
    m.innerHTML=`<div class="wz">${wzHead(3)}<h4>📅 Bagian 3: Jadwal Sumpah & Pejabat</h4><div class="grid">
    ${F('tglSumpah','Tanggal Sumpah','date')}${F('waktu','Waktu')}${F('tempat','Tempat (kosong = kediaman)')}${F('hp','No. HP pemohon')}
    <div><label>Pejabat BA Sumpah</label><select onchange="setv('madya',this.value)">${pjOptLayak(cur.madya)}</select></div>
    <div><label>Pejabat BA Inventarisasi Harta & BAP</label><select onchange="setv('muda',this.value);setv('bapOleh',this.value)">${pjOptLayak(cur.muda)}</select></div></div>
    <div class="wz-f"><button onclick="WZ.on=false;tab='umum';setNav('berkas','Daftar Berkas');renderMain()">Lengkapi detail lain</button><span style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="WZ.on=false;tab='dok';setNav('berkas','Daftar Berkas');renderMain();toast('Berkas tersimpan')">Simpan & Lihat Dokumen</button><button class="pri" onclick="WZ.on=false;tab='dok';setNav('berkas','Daftar Berkas');renderMain();prosesOtomatis()">⚡ Proses Otomatis →</button></span></div></div>`}
}

/* ---------------- pengaturan (admin utama) ---------------- */
function openSet(){if(!isSuper())return;const s=SET;const L={instansi:'Instansi',kanwil:'Kantor wilayah',balai:'Nama balai',alamat:'Alamat',telp:'Telepon',web:'Laman & pos-el',kepala:'Nama Kepala',wa:'Nomor WA layanan',kanwilTembusan:'Tembusan kanwil'};
  dlg(`<h3>⚙ Pengaturan <span class="tag">Admin Utama</span></h3><div class="grid">
  ${Object.keys(L).map(k=>`<div><label>${L[k]}</label><input value="${esc(s[k])}" oninput="SET['${k}']=this.value"></div>`).join('')}
  <div class="full"><label>Logo kop</label><div style="display:flex;gap:10px;align-items:center"><img src="${s.logo||LOGO_DEF}" style="height:48px"><label class="btn" style="margin:0;color:var(--ink)">Ganti logo<input type="file" accept="image/*" hidden onchange="gantiLogo(this)"></label>${s.logo?'<button onclick="delete SET.logo;openSet()">Pakai logo bawaan</button>':''}</div></div>
  <div class="full"><label>Pejabat BHP ${s.pegawaiSumber?`<span class="hint">(sumber: ${esc(s.pegawaiSumber)})</span>`:''}</label>
  <p style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px"><button onclick="sinkronPegawai(this)">🔄 Ambil dari sheet Data Pegawai (Dokumen Otomatis)</button></p>${s.pejabat.map((p,i)=>`<div class="grid child"><input placeholder="Nama" value="${esc(p.nama)}" oninput="SET.pejabat[${i}].nama=this.value"><input placeholder="NIP" value="${esc(p.nip)}" oninput="SET.pejabat[${i}].nip=this.value"><input placeholder="Jabatan" value="${esc(p.jabatan)}" oninput="SET.pejabat[${i}].jabatan=this.value"></div>`).join('')}
  <button onclick="SET.pejabat.push({nama:'',nip:'',jabatan:''});openSet()">+ Pejabat</button></div>
  <div class="full"><label>Lafaz sumpah per agama ({JENIS}, {STATUS}, {PENGADILAN} diganti otomatis)</label>${Object.keys(s.lafaz).map(a=>`<label>${a}</label><textarea oninput="SET.lafaz['${a}']=this.value">${esc(s.lafaz[a])}</textarea>`).join('')}</div>
  <div class="full card" style="padding:12px"><h3>🔢 Koneksi SPS (sps.batamen.com)</h3>
    <p class="hint">Status: ${SPS.terhubung?'<b style="color:var(--ok)">tersimpan</b>':'<b style="color:var(--warn)">belum diisi</b>'}${SPS.cookie?' · cookie':''}${SPS.akun?' · akun':''}. Nomor diambil dengan kode <b>AH.06.03</b> (pengampuan) / <b>AH.06.02</b> (perwalian), nama pegawai = admin yang login. Kredensial disimpan di server, tidak terlihat admin lain.</p>
    <div class="grid"><div><label>Username SPS</label><input id="spsU" autocomplete="off"></div><div><label>Password SPS</label><input id="spsP" type="password" autocomplete="new-password"></div>
    <div class="full"><label>atau Cookie SPS (sama seperti SPS_COOKIE di skrip SAPA WALI)</label><input id="spsC" type="password" autocomplete="off" placeholder="XSRF-TOKEN=…; sps_session=…"></div>
    <div><button onclick="simpanSps()">Simpan kredensial</button></div><div><button onclick="tesSps(this)">🔌 Tes koneksi</button></div></div>
    <div class="row" style="margin-top:8px"><div><label>Tes SPS tanggal mundur</label><input type="date" id="tglMundur"></div><div><button onclick="tesMundur(this)">📅 Cek nomor tersedia</button></div></div><pre id="hasilMundur" style="white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto"></pre></div>
  <div class="full card" style="padding:12px"><h3>✨ AI Claude untuk membaca penetapan</h3><p class="hint">Status: ${ADA_AI?'<b style="color:var(--ok)">terhubung</b>':'<b style="color:var(--warn)">belum terhubung — isi kunci Claude</b>'}. Buat kunci di <a href="https:\/\/console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> → API Keys → Create Key (diawali <b>sk-ant-</b>), lalu tempel di sini. Kunci disimpan di server, tidak terlihat admin lain.</p><div class="grid"><div><label>Kunci Claude (sk-ant-…)</label><input id="gk" type="password" autocomplete="new-password"></div><div><label>&nbsp;</label><button onclick="simpanKunci()">Simpan kunci</button></div><div><label>&nbsp;</label><button onclick="tesAI(this)">🔌 Tes AI</button></div></div></div>
  </div><p style="text-align:right;margin-top:12px"><button onclick="dlgClose();boot()">Batal</button> <button class="pri" onclick="simpanSet()">Simpan pengaturan</button></p>`)}
function gantiLogo(inp){const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,300/img.height);c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);SET.logo=c.toDataURL('image/png');openSet()};img.src=URL.createObjectURL(f)}
